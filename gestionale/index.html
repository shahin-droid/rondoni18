function cloudSplit(St){const out={},meta={},arr=[];for(const [k,v] of Object.entries(St)){if(Array.isArray(v)&&v.every(x=>x&&typeof x==='object'&&!Array.isArray(x))){arr.push(k);v.forEach(x=>{if(!x.id)x.id=uid();out['c_'+k+'/'+cloudSeg(x.id)]=JSON.stringify(x)})}else meta[k]=v}meta.__arrays=arr;out['meta/main']=JSON.stringify(meta);return out}

async function cloudLeggi(){const m=await CLOUD.db.doc('meta/main').get();if(!m.exists)return null;const meta=JSON.parse(m.data().j);const arrays=meta.__arrays||[];delete meta.__arrays;const St=meta;
  for(const k of arrays){const q=await CLOUD.db.collection('c_'+k).get();St[k]=q.docs.map(d=>{const b=d.data();CLOUD.ord['c_'+k+'/'+d.id]=b.o;return{o:b.o||0,x:JSON.parse(b.j)}}).sort((a,b)=>a.o-b.o).map(z=>z.x)}return St}

async function cloudFlush(){if(CLOUD.writing){CLOUD.pending=true;return}CLOUD.writing=true;cloudStato('Salvataggio nell\'archivio condiviso…');let errori=0;
  try{const cur=cloudSplit(S);const ops=[];for(const [p,j] of Object.entries(cur))if(CLOUD.last[p]!==j)ops.push([p,j]);for(const p of Object.keys(CLOUD.last))if(!(p in cur))ops.push([p,null]);
    let i=0;for(const [p,j] of ops){i++;if(ops.length>20&&i%10===0)cloudStato(`Salvataggio nell'archivio condiviso… ${i}/${ops.length}`);
      try{if(j==null){await CLOUD.db.doc(p).delete();delete CLOUD.last[p]}else{if(CLOUD.ord[p]==null)CLOUD.ord[p]=Date.now()+i/1000;await CLOUD.db.doc(p).set({j,o:CLOUD.ord[p]});CLOUD.last[p]=j}}
      catch(e){errori++;const c=e&&e.code;if(c==='invalid_argument'&&!Object.keys(CLOUD.last).length){CLOUD.sola=true;toast('Puoi consultare ma non modificare: chiedi a chi gestisce il gestionale l\'accesso come Contributor');break}
        if(!CLOUD.errMostrato){CLOUD.errMostrato=true;toast(c==='quota_exceeded'?'Archivio condiviso pieno: avvisa Claude':c==='invalid_argument'?'Un elemento è troppo grande per l\'archivio condiviso (es. troppe immagini in un preventivo)':'Archivio condiviso non raggiungibile: i dati restano su questo computer e riprovo al prossimo salvataggio')}}}}
  finally{CLOUD.writing=false;if(CLOUD.ascoltaDopo&&!errori&&!CLOUD.vuoto){CLOUD.ascoltaDopo=false;cloudAscolta(Object.keys(S).filter(k=>Array.isArray(S[k])&&S[k].every(x=>x&&typeof x==='object')))}cloudStato(errori?'Alcune modifiche non sono nell\'archivio condiviso':'Salvato nell\'archivio condiviso');if(CLOUD.pending){CLOUD.pending=false;cloudPush()}}}
let cloudRT;function cloudRender(){clearTimeout(cloudRT);cloudRT=setTimeout(()=>{const a=document.activeElement;if(a&&a.closest&&a.closest('#main')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){cloudRender();return}render.keepScroll=true;render()},600)}
function cloudAscolta(arrays){const sub=(k)=>CLOUD.db.collection('c_'+k).onSnapshot(q=>{let cambi=0;q.docChanges().forEach(ch=>{const p='c_'+k+'/'+ch.doc.id;if(ch.type==='removed'){if(!(p in CLOUD.last))return;delete CLOUD.last[p];const id=JSON.parse(ch.doc.data().j).id;S[k]=(S[k]||[]).filter(x=>x.id!==id);cambi++;return}
    const b=ch.doc.data();if(ch.doc.metadata.hasPendingWrites||b.j===CLOUD.last[p])return;const x=JSON.parse(b.j);CLOUD.last[p]=b.j;CLOUD.ord[p]=b.o;S[k]=S[k]||[];const i=S[k].findIndex(y=>y.id===x.id);if(i>=0)S[k][i]=x;else S[k].push(x);cambi++});
    if(cambi){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudRender()}},e=>{if(e&&e.code==='revoked')cloudStato('Archivio condiviso non più accessibile')});
  arrays.forEach(sub);
  CLOUD.db.doc('meta/main').onSnapshot(d=>{if(!d.exists||d.metadata.hasPendingWrites)return;const j=d.data().j;if(j===CLOUD.last['meta/main'])return;CLOUD.last['meta/main']=j;const m=JSON.parse(j);delete m.__arrays;Object.assign(S,m);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudRender()},()=>{})}
async function cloudAvvio(){if(!window.BTWN_UFFICIALE||!window.claude||!claude.use)return;cloudStato('Collegamento all\'archivio condiviso…');

const SP={cache:{},loading:{},fileArgs:null};
const m365=(tool,input)=>MCP?MCP.callTool(M365,tool,input):Promise.reject({code:'not_granted'});
const spTesti=r=>(r&&r.content||[]).filter(b=>b.type==='text').map(b=>b.text);
const spJson=r=>{const out=[];spTesti(r).forEach(t=>{try{const j=JSON.parse(t);Array.isArray(j)?out.push(...j):out.push(j)}catch(e){}});if(!out.length&&r&&r.payload&&typeof r.payload==='object')out.push(r.payload);return out};
function spParse(r){const txt=spTesti(r).join('\n');const out=[];for(const m of txt.matchAll(/\s*(.+?) \((folder|file), (\d+) bytes\) file:\/\/\/([^\/\s]+)\/([0-9A-Z]{34})/g))out.push({name:m[1].trim(),dir:m[2]==='folder',size:+m[3],driveId:m[4],id:m[5]});return out}
function spLista(driveId,id,force){if(SP.loading[id]||(!force&&SP.cache[id]))return;SP.loading[id]=1;m365('read_resource',{uri:`file:///${driveId}/${id}`}).then(r=>{SP.cache[id]={items:spParse(r).sort((a,b)=>(b.dir-a.dir)||a.name.localeCompare(b.name,'it',{numeric:true}))}}).catch(e=>{SP.cache[id]={err:erroreMcp(e)}}).finally(()=>{delete SP.loading[id];render.keepScroll=true;render()})}

const cartellaPerTipo=tipo=>{const T=String(tipo||'').toUpperCase();const x=CARTELLA_DOC.find(([re])=>re.test(T));return x?x[1]:''};
async function spCartellaDoc(c,nome){c.sp.dirs=c.sp.dirs||{};if(c.sp.dirs[nome])return c.sp.dirs[nome];
  const items=spParse(await m365('read_resource',{uri:`file:///${c.sp.driveId}/${c.sp.id}`})).filter(x=>x.dir);const cand=[nome,...(ALIAS_CARTELLE[nome]||[])].map(x=>x.toUpperCase());
  let f=items.find(x=>x.name.toUpperCase()===cand[0])||items.find(x=>cand.includes(x.name.toUpperCase()));
  if(!f){const r=await m365('sharepoint_create_folder',{driveId:c.sp.driveId,parentItemId:c.sp.id,name:nome});const x=spJson(r)[0]||{};f={id:x.id||String(x.uri||'').split('/').pop(),name:nome}}
  c.sp.dirs[nome]=f.id;return f.id}
/* copia su OneDrive/SharePoint, nella sottocartella giusta, un file appena caricato nel gestionale */
async function spCopiaDoc(c,file,nome,tipo){if(!MCP||!c||!c.sp)return null;const dir=cartellaPerTipo(tipo);if(!dir)return null;

  try{const id=await spCartellaDoc(c,dir);const url=await spCaricaFile(c,id,file,nome);delete SP.cache[id];return{dir,url}}catch(e){toast(`${nome}: non copiato su OneDrive (${erroreMcp(e)})`);return null}}

async function spCaricaFile(c,dirId,f,nome){if(SP.fileArgs==null){try{SP.fileArgs=!!(await MCP.listTools()).fileArgs}catch(e){SP.fileArgs=false}}

/* ---------- Form generico ---------- */
function fieldHtml(f,v){
  const val=v[f.k]??f.def??'';const cls=f.wide?'wide':'';const req=f.req?'required':'';
  if(f.type==='html')return f.html||'';
  if(f.type==='select')return`<label class="${cls}">${f.l}${selectHtml(f.opts,val,`name="${f.k}" ${req}`)}</label>`;
  if(f.type==='images')return`<div class="${cls}"><label>${f.l}</label>${imagesField(f.k,val)}</div>`;
  if(f.type==='textarea')return`<label class="${cls}">${f.l}<textarea name="${f.k}">${esc(val)}</textarea></label>`;
  if(f.type==='checkbox')return`<label class="chk ${cls}"><input type="checkbox" name="${f.k}" ${val?'checked':''}>${f.l}</label>`;
  if(f.type==='multi')return`<div class="${cls}"><label>${f.l}</label><div class="multi" style="margin-top:6px">${f.opts.map(o=>{const v=typeof o==='object'?o.v:o,l=typeof o==='object'?o.l:esc(o);return`<label><input type="checkbox" name="${f.k}" value="${esc(v)}" ${(val||[]).includes(v)?'checked':''}>${l}</label>`}).join('')}</div></div>`;
  if(f.list)return`<label class="${cls}">${f.l}<input name="${f.k}" type="text" list="dl-${f.k}" autocomplete="off" value="${esc(val)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''} ${req}><datalist id="dl-${f.k}">${f.list.map(o=>`<option value="${esc(o.v)}">${esc(o.l||'')}</option>`).join('')}</datalist></label>`;
  return`<label class="${cls}">${f.l}<input name="${f.k}" type="${f.type||'text'}" value="${esc(val)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''} ${f.type==='number'?'step="any"':''} ${req}></label>`;
}
function openForm({title,fields,values={},onSave,calc,onDelete,intro,regole,okLabel}){
  const d=$('#modal');
  d.innerHTML=`<form id="mf" novalidate><div class="modal-head"><h2>${esc(title)}</h2><button type="button" class="ghost icon-btn" data-close aria-label="Chiudi">${ic('x')}</button></div><div class="modal-body">${intro?`<div class="note" style="margin-top:0">${intro}</div>`:''}<div class="form-grid">${fields.map(f=>fieldHtml(f,values)).join('')}</div>${calc?'<div class="calculation" id="calc"></div>':''}<div id="formErr"></div><div class="form-footer">${onDelete?`<button type="button" class="danger" id="mdel" style="margin-right:auto">${ic('trash')}Elimina</button>`:''}<button type="button" data-close>Annulla</button><button class="primary" type="submit">${okLabel||'Salva'}</button></div></div></form>`;
  const form=$('#mf');
  if(fields.some(f=>f.type==='images'))wireImages(form);
  const read=()=>{const o={};fields.forEach(f=>{if(f.type==='multi'){o[f.k]=[...form.querySelectorAll(`[name="${f.k}"]:checked`)].map(x=>x.value);return}const el=form.elements[f.k];if(!el)return;if(el.disabled){o[f.k]=f.type==='checkbox'?false:f.type==='number'?null:'';return}o[f.k]=f.type==='checkbox'?el.checked:f.type==='number'?(el.value===''?null:+el.value):el.value.trim()});return o};
  if(calc){const upd=()=>$('#calc').innerHTML=calc(read());form.addEventListener('input',upd);form.addEventListener('change',upd);upd()}
  d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.close());
  if(onDelete)$('#mdel').onclick=()=>{if(confirm('Eliminare definitivamente?')){onDelete();save();d.close();render();toast('Eliminato')}};
  form.onsubmit=e=>{e.preventDefault();const o=read();const miss=fields.filter(f=>f.req&&(o[f.k]===''||o[f.k]==null)).map(f=>f.l);if(miss.length){$('#formErr').innerHTML=`<div class="error">Compila: ${miss.join(', ')}</div>`;return}
    const res=onSave(o);if(res===false)return;save();d.close();render();toast('Salvato')};

async function testoPptx(buf){const u=new Uint8Array(buf),dv=new DataView(buf);let e=u.length-22;while(e>0&&dv.getUint32(e,true)!==0x06054b50)e--;const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),fl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);files[new TextDecoder().decode(u.subarray(p+46,p+46+fl))]={m,cs,off};p+=46+fl+xl+cl}
  const read=async name=>{const f=files[name];const st=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true);const data=u.subarray(st,st+f.cs);if(f.m===0)return new TextDecoder().decode(data);return new TextDecoder().decode(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())};
  const sl=Object.keys(files).filter(k=>/^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a,b)=>+a.match(/\d+/)[0]-+b.match(/\d+/)[0]);let out='';
  for(const k of sl){const doc=new DOMParser().parseFromString(await read(k),'application/xml');[...doc.getElementsByTagName('a:p')].forEach(pp=>{const t=[...pp.getElementsByTagName('a:t')].map(x=>x.textContent).join('');if(t.trim())out+=t+'\n'})}return out}

function brandIn(t){const T=' '+String(t).toLowerCase().replace(/[^a-z0-9àèéìòù]+/g,' ')+' ';let best=null;S.fornitori.forEach(x=>{x.nome.toLowerCase().split(/\s*\/\s*/).forEach(k=>{k=k.replace(/[^a-z0-9àèéìòù]+/g,' ').trim();if(k.length<3)return;const i=T.indexOf(' '+k+' ');if(i>=0&&(!best||i<best.i))best={i,n:x.nome}})});return best?best.n:''}
function righeDaHomeBook(testo){const L=String(testo).split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);const out=[];let amb='',cur=null;
  L.forEach(l=>{const h=l.match(/^(\d{1,2})[.)]\s+([A-ZÀ-Ü][A-ZÀ-Ü0-9 '’\/\-+]{2,40})$/);if(h){amb=titCase(h[2]);cur=null;return}if(!amb)return;
    const sub=/^(o|◦|–|-)\s+/.test(l),bul=/^[•●▪■]\s*/.test(l);if(!bul&&!sub)return;const t=l.replace(/^(?:[•●▪■]|o|◦|–|-)\s*/,'').replace(/\.$/,'');
    const q=t.match(/^N\.?\s?(\d+)\s+(.*)$/i);const br=brandIn(t);
    if(!sub&&(q||br)){const resto=q?q[2]:t;const mod=(resto.match(/mod\.?\s+([A-Z0-9][\w\-]*)/i)||[])[1]||'';let ogg=resto.split(/\s+(?:mod\.|in |con |da |ad |a |\(|,)/i)[0];if(br)br.split(/\s*\/\s*/).forEach(k=>{ogg=ogg.replace(new RegExp('\\s*\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b.*$','i'),'')});ogg=ogg.replace(/\s*compost[oa] da:?.*$/i,'').replace(/:$/,'');cur={ambiente:amb,oggetto:titCase(ogg.trim()).slice(0,60)||titCase(resto.slice(0,40)),brand:br,modello:mod,qta:q?+q[1]:1,desc:[resto]};out.push(cur)}

  return out.map(r=>({ambiente:r.ambiente,oggetto:r.oggetto,brand:r.brand,modello:r.modello,qta:r.qta,descrizione:r.desc.join('; ').replace(/:\s*;/g,':').slice(0,600)}))}
function riassuntoListato(testo){const T=String(testo);const L=T.split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
