const NAV=[['dashboard','home','Panoramica'],['commesse','folder','Commesse'],['vendite','calc','Preventivi e ordini'],['clienti','users','Clienti'],['agenda','cal','Agenda'],['economia','euro','Economia'],['impostazioni','gear','Impostazioni']];
function route(){const h=location.hash.replace(/^#\/?/,'').split('/');return{view:h[0]||'dashboard',id:h[1],tab:h[2]}}
function go(h){if(location.hash===h)render();else location.hash=h}
/* Regola del gestionale: se una scelta ne esclude un'altra, i campi esclusi diventano grigi e non si compilano.
   regole: [{campi:['nome',...], spento:form=>bool, nota:'perché'}] */
function dipendenze(form,regole){if(!form)return;const v=n=>{const el=form.querySelector(`[name="${n}"]`);return!el?'':el.type==='checkbox'?el.checked:el.value};
  const ap=()=>regole.forEach(r=>{const off=!!r.spento(v,form);(r.sel||[]).forEach(q=>form.querySelectorAll(q).forEach(x=>x.classList.toggle('campo-off',off)));r.campi.forEach(n=>form.querySelectorAll(`[name="${n}"]`).forEach(el=>{const box=el.closest('label')||el.closest('.wide')||el;box.classList.toggle('campo-off',off);el.disabled=off;if(r.nota)box.title=off?r.nota:''}))});
  form.addEventListener('input',ap);form.addEventListener('change',ap);ap()}
/* Riprendi da dove eri: pagina, scorrimento e modulo aperto restano dopo un ricaricamento (es. aggiornamento del gestionale) */
const UI_KEY='btwn-ui';let lastAct=null,restoring=false;
const uiGet=()=>{try{return JSON.parse(localStorage.getItem(UI_KEY))||{}}catch(e){return{}}};
const uiSet=o=>{if(restoring)return;try{localStorage.setItem(UI_KEY,JSON.stringify(Object.assign(uiGet(),o)))}catch(e){}};
let _scT;window.addEventListener('scroll',()=>{clearTimeout(_scT);_scT=setTimeout(()=>uiSet({scroll:window.scrollY}),250)},{passive:true});
function formSnapshot(form){const v={};form.querySelectorAll('[name]').forEach(el=>{if(el.type==='file')return;if(el.type==='checkbox'||el.type==='radio'){if(el.type==='radio'&&!el.checked)return;v[el.name+(el.type==='checkbox'&&form.querySelectorAll(`[name="${el.name}"]`).length>1?'@'+el.value:'')]=el.type==='checkbox'?el.checked:el.value}else v[el.name]=el.value});return v}
function formFill(form,v){Object.entries(v||{}).forEach(([k,val])=>{let el;if(k.includes('@')){const [n,vv]=k.split('@');el=[...form.querySelectorAll(`[name="${n}"]`)].find(x=>x.value===vv);if(el)el.checked=!!val;return}el=form.querySelector(`[name="${k}"]`);if(!el||el.type==='file')return;if(el.type==='checkbox')el.checked=!!val;else if(el.type==='radio'){const r=form.querySelector(`[name="${k}"][value="${val}"]`);if(r)r.checked=true}else el.value=val;el.dispatchEvent(new Event('input',{bubbles:true}))})}
function wireRicorda(form,info,base){base=base||formSnapshot(form);const snap=()=>{const v=formSnapshot(form),d={};Object.keys(v).forEach(k=>{if(v[k]!==base[k])d[k]=v[k]});uiSet({form:Object.assign({},info,{values:d})})};form.addEventListener('input',snap);form.addEventListener('change',snap);snap()}
{const hk=()=>{const m=$('#modal');if(m)m.addEventListener('close',()=>uiSet({form:null}))};if($('#modal'))hk();else document.addEventListener('DOMContentLoaded',hk)}
function riprendi(){const u=uiGet();restoring=true;try{
  if(u.scroll)setTimeout(()=>window.scrollTo(0,u.scroll),60);
  const f=u.form;if(!f)return;
  if(f.wizard){const c=f.cid?commessa(f.cid):null;if(f.cid&&!c)return;wizardCommessa(c,{d:f.d,step:f.step});return}
  if(f.act&&A[f.act]&&!/^(del|nav|pagato|accetta|rev|clear|keep|logout|export|import|print|scarica|invia|send)/i.test(f.act)){A[f.act](f.data||{});const form=$('#mf');if(form&&$('#modal').open){const base=formSnapshot(form);formFill(form,f.values);wireRicorda(form,f,base)}}
}catch(e){console.log('riprendi',e)}finally{restoring=false}}

  $('#loginForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const n=(f.get('nuovo')||'').trim();let id=f.get('u');

async function emlFile({to,subject,body,attachments=[]}){

  for(const a of attachments){const data=(await blobToDataURL(a.blob)).split(',')[1];const fn=encodeURIComponent(a.name);m+=`--${bd}\r\nContent-Type: ${a.type||'application/octet-stream'}; name="=?UTF-8?B?${b64utf8(a.name)}?="\r\nContent-Disposition: attachment; filename*=UTF-8''${fn}\r\nContent-Transfer-Encoding: base64\r\n\r\n${wrap76(data)}`}
  return m+`--${bd}--\r\n`;
}

function icsEvento(e){const c=commessa(e.commessaId);const p2=x=>String(x).padStart(2,'0');const d=(e.data||today()).replace(/-/g,'');let dt;

function vEconomia(){
  const cs=S.commesse.filter(c=>['Attiva','Chiusa','Sospesa'].includes(c.stato));

  const T=Q.reduce((a,{q})=>{for(const k of ['acq','fatt','inc','daInc','sca','daFatt','costi','marg'])a[k]=(a[k]||0)+q[k];return a},{});
  const rs=S.rate.filter(r=>commessa(r.commessaId));const y=new Date().getFullYear();
  const mese=d=>d?d.slice(0,7):'';
  const months=[...Array(12)].map((_,i)=>`${y}-${String(i+1).padStart(2,'0')}`);
  const M=months.map(m=>({m,f:rs.filter(r=>r.stato!=='Prevista'&&mese(r.dataFattura||r.scadenza)===m).reduce((a,r)=>a+(+r.importo||0),0),i:rs.filter(r=>r.stato==='Incassata'&&mese(r.dataIncasso||r.scadenza)===m).reduce((a,r)=>a+(+r.importo||0),0),p:rs.filter(r=>r.stato!=='Incassata'&&mese(r.scadenza)===m).reduce((a,r)=>a+(+r.importo||0),0)}));
  const fy=M.reduce((a,x)=>a+x.f,0),iy=M.reduce((a,x)=>a+x.i,0);

    <div class="card"><div class="card-label">Fatturato ${y}</div><div class="metric amount">${eur(fy)}</div><div class="card-foot">fatture emesse nell'anno</div></div>
    <div class="card"><div class="card-label">Incassato ${y}</div><div class="metric amount" style="color:#4f7a3a">${eur(iy)}</div><div class="card-foot">soldi ricevuti nell'anno</div></div>
    <div class="card"><div class="card-label">Da incassare</div><div class="metric amount">${eur(T.daInc)}</div><div class="card-foot">${T.sca?`<span style="color:var(--red)">${eur(T.sca)} scaduti</span>`:'nessuna fattura scaduta'}</div></div>
    <div class="card"><div class="card-label">Da fatturare</div><div class="metric amount">${eur(T.daFatt)}</div><div class="card-foot">lavoro acquisito non ancora fatturato</div></div>
  </div>
  <div class="panel"><div class="panel-head"><h2>Per commessa</h2><span class="subtle">imponibili, IVA esclusa</span></div><div class="table-wrap"><table><thead><tr><th>Commessa</th><th class="right-txt">Acquisito</th><th class="right-txt">Fatturato</th><th class="right-txt">Incassato</th><th class="right-txt">Da incassare</th><th class="right-txt">Da fatturare</th><th class="right-txt">Costi registrati</th><th class="right-txt">Margine</th></tr></thead><tbody>${Q.sort((a,b)=>b.q.acq-a.q.acq).map(({c,q})=>`<tr><td><button class="link" data-act="nav" data-h="#/commessa/${c.id}/pagamenti">${esc(c.nome)}</button><small>${esc(c.tipo==='Privato'?'Cliente privato':'Operazione')} · ${esc(c.stato)}</small></td><td class="amount right-txt">${eur(q.acq)}</td><td class="amount right-txt">${eur(q.fatt)}</td><td class="amount right-txt">${eur(q.inc)}</td><td class="amount right-txt ${q.sca?'warn':''}">${eur(q.daInc)}</td><td class="amount right-txt">${eur(q.daFatt)}</td><td class="amount right-txt">${q.costi?eur(q.costi):'<span class="muted">—</span>'}</td><td class="amount right-txt">${q.costi?`${eur(q.marg)}<small>${q.acq?(q.marg/q.acq*100).toFixed(1)+'%':''}</small>`:'<span class="muted">—</span>'}</td></tr>`).join('')}<tr><td><b>Totale</b></td><td class="amount right-txt"><b>${eur(T.acq)}</b></td><td class="amount right-txt"><b>${eur(T.fatt)}</b></td><td class="amount right-txt"><b>${eur(T.inc)}</b></td><td class="amount right-txt"><b>${eur(T.daInc)}</b></td><td class="amount right-txt"><b>${eur(T.daFatt)}</b></td><td class="amount right-txt"><b>${eur(T.costi)}</b></td><td></td></tr></tbody></table></div></div>
  ${fattureEmessePanel()}

  <div class="panel">${rateTable(rs.filter(filt[ui.rateFiltro]),true)}</div>`;

  clearDemo:()=>{if(!confirm('Rimuovere unità, rate e appuntamenti di esempio? Commesse, clienti e brand restano.'))return;S.unita=[];S.rate=[];S.eventi=[];S.demo=false;save();render();toast('Esempi rimossi')},
  keepDemo:()=>{S.demo=false;save();render()},
  cloudInizia:()=>{CLOUD.vuoto=false;save();render();toast('Archivio condiviso avviato')},
  export:async()=>{const files=[];for(const [id,f] of FILES)files.push({id,name:f.name,type:f.type,data:await blobToDataURL(f.blob)});const json=JSON.stringify(Object.assign({},S,{_files:files}));download(`btwn-bussola-backup-${today()}.json`,json,'application/json');toast(`Backup esportato (${kb(json.length)}, ${files.length} file)`)},
  exportCsv:()=>{const rows=[['Commessa','Rata','Intestatario','N. fattura','Data fattura','Imponibile','IVA %','Totale','Scadenza','Stato','Data incasso']];S.rate.forEach(r=>{const c=commessa(r.commessaId);if(!c)return;rows.push([c.nome,r.descrizione,r.controparte||'',r.numero||'',r.dataFattura||'',String(r.importo).replace('.',','),ivaR(r),String(Math.round(totR(r)*100)/100).replace('.',','),r.scadenza||'',r.stato==='Prevista'?'Da emettere':r.stato==='Fatturata'?'Da incassare':'Incassata',r.dataIncasso||''])});download(`btwn-fatture-${today()}.csv`,'\ufeff'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv')},
  import:()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!d.commesse||!d.users)throw new Error();sceltaImport(d)}).catch(()=>toast('File di backup non valido'))};i.click()},
  importaFiltrato:d=>{const fl=d._files||[];delete d._files;S=d;CLOUD.vuoto=false;save();(async()=>{for(const f of fl){const b=await (await fetch(f.data)).blob();await idbTx('readwrite',st=>st.put({id:f.id,name:f.name,type:f.type,size:b.size,blob:b}));FILES.set(f.id,{name:f.name,type:f.type,size:b.size,blob:b,url:URL.createObjectURL(b)})}render()})();if(!me())localStorage.setItem(SESSION,S.users[0].id);render();toast('Backup importato')},
  resetDemo:()=>{if(confirm('Sostituire tutti i dati con quelli dimostrativi?')){const name=me().nome;S=seed();const u=S.users.find(x=>x.nome===name)||S.users[0];localStorage.setItem(SESSION,u.id);save();go('#/dashboard');toast('Dati dimostrativi ripristinati')}},
  wipe:()=>{if(confirm('Cancellare TUTTI i dati? Esporta prima un backup.')&&confirm('Confermi la cancellazione?')){const u=me();S={version:1,demo:false,azienda:S.azienda,users:[u],clienti:[],commesse:[],unita:[],rate:[],eventi:[],fornitori:[]};save();go('#/dashboard');toast('Dati cancellati')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.closest('dialog')&&!t.closest('#app'))return;const f=A[t.dataset.act];if(f){e.preventDefault();lastAct={act:t.dataset.act,data:Object.assign({},t.dataset)};f(t.dataset,t)}});
document.addEventListener('change',e=>{
  const gt=e.target.closest('[data-cl][data-ls][data-f]');
  if(gt){const c=commessa(gt.dataset.cl),r=(c[gt.dataset.ls]||[]).find(x=>x.id===gt.dataset.r);if(!r)return;const v=gt.value;r[gt.dataset.f]=gt.type==='number'?(v===''?null:+String(v).replace(',','.')):v;if(gt.dataset.ls==='capItems'){if(gt.dataset.f==='scAcq')r.scAcqF='';if(gt.dataset.f==='brand'){const fo=fornByName(v);if(fo){const dir=fo.scontoAcqF||fo.scontoAcq;const sa=dir!=null&&dir!==''?dir:fo.scontoRiv;if(sa!=null&&sa!==''){r.scAcq=scontoEff(sa);r.scAcqF=String(sa).includes('+')?String(sa):'';r.acqVia=(dir!=null&&dir!=='')?'':(fo.rivNome||'rivenditore');setTimeout(()=>toast(`${fo.nome}: sconto d'acquisto ${sa}${String(sa).includes('+')?' (eff. '+scontoEff(sa)+'%)':'%'}${r.acqVia?' tramite '+r.acqVia:''} caricato`),50)}else setTimeout(()=>toast(`${fo.nome} non ha uno sconto d'acquisto nella sua scheda: inseriscilo qui o in Brand e fornitori`),50)}}capAggiornaPack(c)}save();setTimeout(()=>{render.keepScroll=true;render()},0);return}
  const g=e.target.closest('[data-pr][data-f]');
  if(g){const p=byId('preventivi',g.dataset.pr),r=p&&p.righe.find(x=>x.id===g.dataset.r);if(!r)return;const f=g.dataset.f;
    let v=g.value;if(f==='scAcq'){if(String(v).includes('+')){r.scAcqF=String(v).replace(/\s/g,'');v=scontoEff(v)}else{r.scAcqF='';v=v===''?null:+String(v).replace('%','').replace(',','.')}}else if(['qta','listino','scCli'].includes(f))v=v===''?null:+String(v).replace(',','.');if(f==='listino'&&r.listino!=null&&r.listino!==''&&v!==r.listino){r.storico=(r.storico||[]).concat({data:today(),listino:+r.listino,nota:'modifica a mano'})}r[f]=v;
    if(f==='brand'||f==='acquista'){const fo=fornByName(r.brand);if(fo&&(f==='brand'||fo.scontoRiv||fo.scontoRivCamp)){const sa=scontoBrand(fo,r,p);if(sa!=null&&sa!==''){r.scAcqF=String(sa).includes('+')?String(sa):'';r.scAcq=scontoEff(sa)}if(fo.scontoCli!=null&&fo.scontoCli!=='')r.scCli=+fo.scontoCli;if(sa!=null&&sa!=='')setTimeout(()=>toast(`${fo.nome}: sconto d'acquisto ${sa}${String(sa).includes('+')?' (eff. '+scontoEff(sa)+'%)':'%'}${r.acquista==='Partner'&&fo.scontoRiv?' tramite '+(fo.rivNome||'rivenditore'):''}${p.campione&&fo.scontoCamp?' (appartamento campione)':''} caricato`),50)}if(f==='brand'&&String(v).toUpperCase()==='BTWN'&&r.scAcq==null)r.scAcq=0}
    save();setTimeout(()=>{render.keepScroll=true;render()},0);return}
  const t=e.target.closest('[data-change]');if(!t)return;const d=t.dataset;
  if(d.change==='budget'||d.change==='noteRaccolta'){const c=commessa(d.id);if(d.change==='budget'){c.budget=t.value===''?null:+t.value;if(c.budget){c.steps=c.steps||{};if(!c.steps.budget)c.steps.budget=today()}}else c.noteRaccolta=t.value;save();render.keepScroll=true;render();toast(d.change==='budget'?'Budget salvato':'Note salvate');return}
  if(d.change==='consegnaPian'){const c=commessa(d.id);c[d.k]=t.type==='number'?(t.value===''?null:+t.value):t.value;
    if(c.dataConsegna){c.steps=c.steps||{};if(!c.steps.cons_pian)c.steps.cons_pian=today();let e=S.eventi.find(x=>x.commessaId===c.id&&x.auto==='consegna');if(!e){e={id:uid(),commessaId:c.id,tipo:'Consegna',fatto:false,auto:'consegna'};S.eventi.push(e)}const g=+c.durataConsegna||1;e.data=c.dataConsegna;e.titolo=`Consegna e montaggio · ${c.nome}${g>1?` (${g} giorni, fino al ${fd(addDays(c.dataConsegna,g-1))})`:''}`;const cl=cliente(c.clienteId);e.luogo=cl?[cl.via,cl.citta].filter(Boolean).join(', '):''}
    save();render.keepScroll=true;render();toast(c.dataConsegna?'Consegna pianificata e messa in Agenda':'Salvato');return}
  if(d.change==='diffRil'){const c=commessa(d.id);c.diffRil=c.diffRil||{};c.diffRil[d.k]=t.value===''?null:+t.value;if(c.diffRil.cliente!=null||c.diffRil.listino!=null){c.steps=c.steps||{};if(!c.steps.ril_diff)c.steps.ril_diff=today()}save();render.keepScroll=true;render();toast('Differenziale salvato');return}
  if(d.change==='docTipoUp'){ui.docTipo=t.value;return}
  if(d.change==='docRinomina'){const c=commessa(d.id),f=c.files[+d.i];if(!t.value)return;const nome=nomeDoc(c,t.value,f.nome);f.nome=nome;f.tipo=t.value;const F=f.fileId&&FILES.get(f.fileId);if(F){F.name=nome;idbTx('readwrite',st=>st.put({id:f.fileId,name:nome,type:F.type,size:F.size,blob:F.blob}))}save();render.keepScroll=true;render();toast('Rinominato: '+nome);return}
  if(d.change==='fatCommessa'){const f=byId('fatture',d.id);if(f){f.commessaId=t.value;save();toast('Fattura collegata alla commessa')}return}
  if(d.change==='fatQ'){ui.fatQ=t.value;render.keepScroll=true;render();return}
  if(d.change==='servPerc'){const p=byId('preventivi',d.id);p.servPerc=t.value===''?null:+t.value;save();render.keepScroll=true;render();return}
  if(d.change==='scDiff'){const p=byId('preventivi',d.id);p.scDiff=t.value===''?null:+t.value;save();render.keepScroll=true;render();return}
  if(d.change==='selUnita'){ui.selUnita=ui.selUnita||new Set();if(t.checked)ui.selUnita.add(d.u);else ui.selUnita.delete(d.u);render.keepScroll=true;render();return}
  if(d.change==='capAssegna'){const u=byId('unita',d.u),c=commessa(u.commessaId);u.cap=u.cap||{};if(t.value)u.cap[d.cat]=t.value;else delete u.cap[d.cat];capAggiornaPack(c);save();render.keepScroll=true;render();return}
  if(d.change==='cliTipo'){ui.cliTipo=t.value;render.keepScroll=true;render();return}
  if(d.change==='filtroStato'){ui.filtroStato=t.value;render()}
  if(d.change==='statoUnita'){const u=byId('unita',d.id);u.stato=t.value;save();render();toast(u.codice+' → '+t.value)}
  if(d.change==='statoRata'){const r=byId('rate',d.id);r.stato=t.value;save();render();toast('Rata: '+t.value)}
  if(d.change==='prevStato'){const p=byId('preventivi',d.id);if(t.value==='Accettato'){t.value=p.stato;A.accettaPrev({id:p.id});return}p.stato=t.value;save();render();toast('Preventivo: '+t.value)}
  if(d.change==='ordineStato'){const o=byId('ordini',d.id);o.stato=t.value;save();render.keepScroll=true;render();toast(o.fornitore+' → '+t.value)}
  if(d.change==='arrPrezzo'){const c=commessa(d.id);c.arrPrezzi=Object.assign({},c.arrPrezzi,{[d.k]:t.value===''?null:+t.value});save();render.keepScroll=true;render()}
  if(d.change==='capFormula'){const c=commessa(d.id);c.capFormula=t.value;c.quotaSvilPerc=null;capAggiornaPack(c);save();render.keepScroll=true;render()}
  if(d.change==='retro'){const c=commessa(d.id);c[d.k]=t.type==='number'?(t.value===''?null:+t.value):t.value;if(d.k==='quotaSvilPerc')capAggiornaPack(c);save();render.keepScroll=true;render()}
  if(d.change==='diffCfg'){const c=commessa(d.id);c.diffCfg=Object.assign(diffCfg(c),{[d.k]:t.type==='number'?+t.value:t.value});save();render.keepScroll=true;render()}
  if(d.change==='formula'){const c=commessa(d.id);c.formula=t.value;save();render.keepScroll=true;render()}
  if(d.change==='cfgTipo'){const c=commessa(d.id);c.cfgTipo=t.value;save();render.keepScroll=true;render()}
  if(d.change==='statoVar'){const u=byId('unita',d.id);u.statoVar=t.value;u.varianti=t.value!==SV_NESSUNA;save();render.keepScroll=true;render();toast(u.codice+' · '+t.value)}
  if(d.change==='confUpload'){const f=t.files[0];if(f)caricaConferma(commessa(d.c),d.o||null,f);t.value='';return}
  if(d.change==='uploadFornDocs'){const f=byId('fornitori',d.id);(async()=>{for(const file of t.files){const id=await putFile(file,file.name);(f.files=f.files||[]).push({nome:file.name,data:today(),fileId:id,size:file.size})}save();render.keepScroll=true;render();toast('Caricato')})();return}
  if(d.change==='margObj'){S.impostazioni=Object.assign({},S.impostazioni,{margine:+t.value||30});save();render.keepScroll=true;render();toast('Margine obiettivo: '+margObj()+'%')}
  if(d.change==='uploadDocs'){uploadDocs(commessa(d.id),[...t.files]);return}
  if(d.change==='todoFatto'){const x=S.todo.find(y=>y.id===d.id);if(x){x.stato=t.checked?'Fatto':'Da fare';x.fattoIl=t.checked?today():''}save();render.keepScroll=true;if($('#modal').open&&!$('#mf .form-grid input'))$('#modal').close();render();if(t.checked)toast('To-do completato');return}
  if(d.change==='spUpload'){const c=commessa(d.id);const files=[...t.files];t.value='';(async()=>{if(SP.fileArgs==null){try{SP.fileArgs=!!(await MCP.listTools()).fileArgs}catch(e){SP.fileArgs=false}}let ok=0;
      for(const f of files){if(f.size>1048576){toast(f.name+': oltre 1 MB, caricalo direttamente su SharePoint');continue}
        try{let b64;if(SP.fileArgs)b64={$file:{data:f,name:f.name,type:f.type||'application/octet-stream'}};else{if(f.size>700000){toast(f.name+': troppo grande da qui, caricalo su SharePoint');continue}b64=(await blobToDataURL(f)).split(',')[1]}
          await m365('sharepoint_upload_file',{driveId:c.sp.driveId,parentItemId:d.dir,filename:f.name,contentBase64:b64,conflictBehavior:'rename'});ok++}catch(e){toast(f.name+': '+erroreMcp(e))}}
      if(ok){toast(ok+' file caricati su SharePoint');delete SP.cache[d.dir];spLista(c.sp.driveId,d.dir,true)}})();return}
  if(d.change==='forfaitProg'){const c=commessa(d.id);c.forfaitProg=t.value===''?null:+t.value;const r=prevDi(c.id).flatMap(p=>p.righe||[]).find(x=>x.progEst);if(r)r.listino=+t.value||0;save();toast('Forfait aggiornato');return}
  if(d.change==='slaStep'){S.azienda=S.azienda||{};S.azienda.sla=S.azienda.sla||{};if(t.value==='')delete S.azienda.sla[d.k];else S.azienda.sla[d.k]=+t.value;save();return}
  if(d.change==='todoMiei'){ui.todoMiei=t.value;render.keepScroll=true;render();return}
  if(d.change==='taskChi'){ui.taskChi=t.value;render.keepScroll=true;render();return}
  if(d.change==='step'){const c=commessa(d.id);c.steps=c.steps||{};if(t.checked){c.steps[d.k]=today();if(+d.f>c.fase){c.fase=+d.f;c.faseDal=today()}if(STEP_EVENTO[d.k])eventoCommessa(c,STEP_EVENTO[d.k])}else delete c.steps[d.k];save();render.keepScroll=true;render()}
  if(d.change==='ripStato'){const c=commessa(d.id);c.ripristini[+d.i].stato=t.value;save();render.keepScroll=true;render();toast('Ripristino: '+t.value)}
  if(d.change==='doc'){const c=commessa(d.id);c.docs=c.docs||{};c.docs[d.i]=t.checked?1:0;save();render()}
});
