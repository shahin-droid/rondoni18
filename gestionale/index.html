  });
  if(isAdmin())S.fornitori.forEach(f=>{if(!f.ctrFine)return;const lim=ctrDisdetta(f),dd=daysTo(lim),df=daysTo(f.ctrFine);

    if(o.arrivo&&daysTo(o.arrivo)<0&&['Da ordinare','Ordinato','Confermato'].includes(o.stato))out.push({sev:2,icon:'box',t:`${o.fornitore} · merce attesa dal ${fd(o.arrivo)}`,s:`${c.nome} · ordine ${o.numero||'—'} ancora "${o.stato}"`,go:`#/commessa/${c.id}/ordini`});

  });
  return out.sort((a,b)=>b.sev-a.sev);
}

function diffCfg(c){return Object.assign({tipo:'fasce',sconto:null,fasce:'',paga:'cliente'},c.diffCfg||{})}
const fasceList=c=>String(diffCfg(c).fasce||'').split(';').map(x=>x.split(':').map(y=>y.trim())).filter(x=>x[0]&&x[1]!==undefined&&x[1]!=='');
const politicaOk=c=>{const g=diffCfg(c);return g.tipo==='fisso'?g.sconto!=null&&g.sconto!=='':fasceList(c).length>0};
function scontoDiff(c,d){if(!politicaOk(c))return null;const cfg=diffCfg(c);if(cfg.tipo==='fisso')return +cfg.sconto||0;let last=0;for(const [lim,sc] of fasceList(c)){if(lim==='oltre')return +sc;if(d<=+lim)return +sc;last=+sc}return last}
function listinoCapitolato(c,u){return (c.pack||[]).filter(r=>r.tipologicoId&&r.tipologicoId===u.tipologicoId&&r.elemento!=='Voucher arredo').reduce((a,r)=>a+(+r.listino||0),0)}
function diffUnita(c,u){const cap=listinoCapitolato(c,u);if(!u.listinoProgetto)return null;const d=(+u.listinoProgetto)-cap;const sc=d>0?scontoDiff(c,d):0;return{cap,prog:+u.listinoProgetto,d,sc,netto:d>0?(sc==null?null:d*(1-sc/100)):0}}
function varCfg(c){const g=Object.assign({strada:'cliente',base:'perc',fee:FEE.varianti*100,quotaSvil:50,parte2:false,feeCantiere:FEE.consulenza*100,baseCantiere:'perc',cantiereSu:'tutti',preventivo:'noi'},c.varCfg||{});
  if(c.varCfg&&c.varCfg.feeCli!==undefined&&c.varCfg.strada===undefined){g.fee=+c.varCfg.feeCli||0;g.parte2=+c.varCfg.feeSvil>0;g.feeCantiere=+c.varCfg.feeSvil||0;g.cantiereSu=c.varCfg.svilSu||'tutti'}return g}
const quotaSvilVar=g=>g.strada==='cliente'?0:g.strada==='misto'?(+g.quotaSvil||50)/100:1;
function varFees(c){
  const g=varCfg(c),us=unitaDi(c.id),on=c.servizi.includes(SV.var);if(!on)return{cli:0,svil:0,cantiere:0,nVar:0,cfg:g};
  const vu=us.filter(u=>u.varianti);const feeU=u=>g.base==='perc'?(+u.prezzo||0)*(+g.fee||0)/100:(+g.fee||0);
  const tot=vu.reduce((a,u)=>a+feeU(u),0),qs=quotaSvilVar(g);
  const baseC=g.cantiereSu==='tutti'?us:vu;const cantiere=g.parte2?baseC.reduce((a,u)=>a+(g.baseCantiere==='perc'?(+u.prezzo||0)*(+g.feeCantiere||0)/100:(+g.feeCantiere||0)),0):0;
  return{cli:tot*(1-qs),svil:tot*qs+cantiere,gestione:tot,cantiere,nVar:vu.length,feeU,qs,cfg:g};
}
function packCalc(c,r){const t=(c.tipologici||[]).find(x=>x.id===r.tipologicoId);const n=t?+t.unita||0:0;const L=+r.listino||0;const prezzo=L*(1-(+r.scVend||0)/100), costo=L*(1-(+r.scAcq||0)/100);const ades=(c.formula==='scontato'?(r.adesione==null||r.adesione===''?100:+r.adesione):100)/100;const q=n*ades;return{n,prezzo,costo,marg:prezzo-costo,q,tot:q*prezzo,margTot:q*(prezzo-costo)}}
function quotaServizi(c,tot){const v=+c.quotaVal||0;if(!v)return 0;if((c.quotaTipo||'perc')==='perc')return tot*v/100;return (c.tipologici||[]).reduce((a,t)=>a+(+t.unita||0),0)*v}
function serviziTot(c){
  const on=k=>c.servizi.includes(SV[k]);
  const arr=on('arr')&&c.arrLivello?(+((c.arrPrezzi||{})[c.arrLivello])||0):0;
  const mk=on('mk')?(c.marketing||[]).reduce((a,x)=>a+(+x.qta||1)*(+x.prezzo||0),0):0;
  const lv=on('lev')?(c.pack||[]).reduce((a,r)=>{const x=packCalc(c,r);a.tot+=x.tot;a.marg+=x.margTot;return a},{tot:0,marg:0}):{tot:0,marg:0};
  const cfg=on('cfg')?(c.cfgVoci||[]).reduce((a,x)=>a+(+x.qta||1)*(+x.prezzo||0),0):0;
  return{arr,mk,lev:lv.tot+(on('lev')?quotaServizi(c,lv.tot):0),levMarg:lv.marg,cfg};
}
function valoreAcquisito(c){
  if(!['Attiva','Chiusa','Sospesa'].includes(c.stato))return 0;
  const rs=rateDi(c.id).reduce((a,r)=>a+(+r.importo||0),0);let v;
  if(c.tipo==='Privato'){const acc=prevDi(c.id).find(p=>p.stato==='Accettato');v=(acc?prevCalc(acc).netto:0)+(c.steps&&c.steps.hb_firma?(+c.hbFee||HB_FEE):0)}
  else{const n0=commessaNumeri(c);v=n0.valore||0}
  return Math.max(v,rs);
}
function costiCommessa(c){const o=ordiniDi(c.id).reduce((a,x)=>a+(+x.importo||+x.previsto||0),0);const e=(c.esterni||[]).reduce((a,x)=>a+(+x.importo||0),0);const l=+(c.logistica&&c.logistica.importo)||0;return{ordini:o,esterni:e,logistica:l,tot:o+e+l}}
function quadro(c){const rs=rateDi(c.id);const acq=valoreAcquisito(c);const fatt=rs.filter(r=>r.stato!=='Prevista').reduce((a,r)=>a+(+r.importo||0),0);const inc=rs.filter(r=>r.stato==='Incassata').reduce((a,r)=>a+(+r.importo||0),0);const sca=rs.filter(r=>r.stato==='Fatturata'&&r.scadenza&&daysTo(r.scadenza)<0).reduce((a,r)=>a+(+r.importo||0),0);const co=costiCommessa(c);return{acq,fatt,inc,daInc:fatt-inc,sca,daFatt:Math.max(0,acq-fatt),costi:co.tot,co,marg:acq-co.tot}}
function commessaNumeri(c){
  const us=unitaDi(c.id), rs=rateDi(c.id);
  const pack=us.reduce((a,u)=>a+(+u.pack||0),0);
  const prezzi=us.reduce((a,u)=>a+(+u.prezzo||0),0);
  const vf=varFees(c);const feeVar=vf.cli, feeCons=vf.svil;
  const sv=serviziTot(c);
  const incassato=rs.filter(r=>r.stato==='Incassata').reduce((a,r)=>a+r.importo,0);

  const valore=c.valore!=null&&c.valore!==''?+c.valore:(pack+feeVar+feeCons+sv.arr+sv.mk+sv.lev+sv.cfg);
  return{us,rs,pack,prezzi,feeVar,feeCons,incassato,aperto,valore,vf,sv};
}

  const in30=S.rate.filter(r=>r.stato!=='Incassata'&&r.scadenza&&daysTo(r.scadenza)<=30);

/* ---------- Commesse ---------- */
function vCommesse(){
  const q=ui.q.toLowerCase();
  let list=S.commesse.filter(c=>{
    if(ui.filtroStato==='Attive'&&!['Attiva','Pipeline','Sospesa'].includes(c.stato))return false;
    if(!['Attive','Tutte'].includes(ui.filtroStato)&&c.stato!==ui.filtroStato)return false;
    const cl=cliente(c.clienteId);
    return!q||[c.nome,c.codice,c.luogo,c.brand,cl&&cl.nome].join(' ').toLowerCase().includes(q)});
  const tb=`<div class="toolbar"><div class="search">${ic('search')}<input id="q" placeholder="Cerca commessa, cliente, brand…" value="${esc(ui.q)}"></div>
  ${selectHtml(['Attive','Tutte',...STATI_COMMESSA],ui.filtroStato,'data-change="filtroStato"')}
  <div class="seg" style="margin-left:auto"><button class="${ui.commesseMode==='lista'?'active':''}" data-act="mode" data-m="lista">${ic('list')}Lista</button><button class="${ui.commesseMode==='kanban'?'active':''}" data-act="mode" data-m="kanban">${ic('grid')}Fasi</button></div></div>`;
  let body;
  if(!list.length)body=`<div class="panel">${empty('folder','Nessuna commessa trovata','Prova a cambiare i filtri o crea una nuova commessa.',`<button class="primary" data-act="newCommessa">${ic('plus')}Nuova commessa</button>`)}</div>`;
  else if(ui.commesseMode==='kanban'){
    const board=(F,ls)=>`<div class="kanban">${[['Pipeline',ls.filter(c=>c.stato==='Pipeline')],...F.map((f,i)=>[`${i+1}. ${f}`,ls.filter(c=>c.stato!=='Pipeline'&&c.fase===i+1)])].filter(([t,cs])=>cs.length).map(([t,cs])=>`<div class="column"><h3>${t} <span class="subtle">${cs.length}</span></h3>${cs.map(c=>{const cl=cliente(c.clienteId);return`<div class="project-card" data-act="nav" data-h="#/commessa/${c.id}">${tagStato(c.stato)} <span class="subtle">${esc(c.codice)}</span><b>${esc(c.nome)}</b><p>${esc(cl?cl.nome:c.luogo||'—')}</p><p>${c.unitaTot?c.unitaTot+' unità · ':''}${c.valore?eur(c.valore):''}</p>${progress(c)}</div>`}).join('')}</div>`).join('')}</div>`;
    const lp=list.filter(c=>c.tipo==='Privato'),lo=list.filter(c=>c.tipo!=='Privato');
    body=(lp.length?`<div class="table-title"><h2>Clienti privati</h2></div>${board(FASI_PRIVATO,lp)}`:'')+(lo.filter(c=>wfFor(c)===WF_PACK).length?`<div class="table-title"><h2>Operazioni · Interior Pack</h2></div>${board(FASI_PACK,lo.filter(c=>wfFor(c)===WF_PACK))}`:'')+(lo.filter(c=>wfFor(c)===WF_SERVIZIO).length?`<div class="table-title"><h2>Operazioni · altri servizi</h2></div>${board(FASI_SERVIZIO,lo.filter(c=>wfFor(c)===WF_SERVIZIO))}`:'');
  } else {
    body=`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Commessa</th><th>Cliente</th><th>Stato</th><th>Fase</th><th>Servizi</th><th>Unità</th><th class="right-txt adm">Valore</th></tr></thead><tbody>${list.map(c=>{const cl=cliente(c.clienteId),n=commessaNumeri(c);return`<tr><td><button class="link" data-act="nav" data-h="#/commessa/${c.id}">${esc(c.nome)}</button><small>${esc(c.codice)} · ${esc(c.luogo||'—')}</small></td><td>${cl?esc(cl.nome):'<span class="muted">—</span>'}</td><td>${tagStato(c.stato)}${c.stato==='Pipeline'?` <span class="subtle">${c.probabilita||0}%</span>`:''}</td><td style="min-width:150px"><span class="subtle">${c.fase}. ${fasiFor(c)[c.fase-1]||''}</span>${progress(c)}</td><td>${c.servizi.map(s=>`<span class="tag gray">${esc(s)}</span>`).join(' ')}</td><td>${n.us.length||''}${c.unitaTot?(n.us.length?' / ':'')+c.unitaTot:''}</td><td class="amount right-txt adm">${n.valore?eur(n.valore):'—'}</td></tr>`}).join('')}</tbody></table></div></div>`;
  }
  return`<div class="head"><div><div class="eyebrow">Operazioni</div><h1>Commesse</h1><p>Clienti privati: workflow in 16 fasi, dal contatto alla chiusura. Operazioni immobiliari: workflow Interior Pack in 17 fasi; render, varianti e configuratore seguono i passaggi della scheda Servizi. Nella vista per fasi compaiono solo le fasi con commesse.</p></div><button class="primary" data-act="newCommessa">${ic('plus')}Nuova commessa</button></div>${tb}${body}`;
}

/* ---------- Outlook desktop: mail pronte (.eml) e appuntamenti (.ics) ---------- */
const b64utf8=t=>btoa(unescape(encodeURIComponent(t)));
const wrap76=x=>x.replace(/.{1,76}/g,'$&\r\n');
async function emlFile({to,subject,body,attachments=[]}){
  const bd='----=_BTWN_'+uid();
  let m=`To: ${to||''}\r\nSubject: =?UTF-8?B?${b64utf8(subject)}?=\r\nX-Unsent: 1\r\nMIME-Version: 1.0\r\nContent-Type: multipart/mixed; boundary="${bd}"\r\n\r\n--${bd}\r\nContent-Type: text/plain; charset="utf-8"\r\nContent-Transfer-Encoding: base64\r\n\r\n${wrap76(b64utf8(body))}`;
  for(const a of attachments){const data=(await blobToDataURL(a.blob)).split(',')[1];const fn=encodeURIComponent(a.name);m+=`--${bd}\r\nContent-Type: ${a.type||'application/octet-stream'}; name="=?UTF-8?B?${b64utf8(a.name)}?="\r\nContent-Disposition: attachment; filename*=UTF-8''${fn}\r\nContent-Transfer-Encoding: base64\r\n\r\n${wrap76(data)}`}
  return m+`--${bd}--\r\n`;
}
async function inviaOutlook({to,subject,body,attachments,nomeFile}){const eml=await emlFile({to,subject,body,attachments});download(nomeFile.replace(/[\\/:*?"<>|]/g,'-')+'.eml',eml,'message/rfc822');toast('Apri il file scaricato: si apre in Outlook la mail pronta, con l\'allegato')}
function testoMail(c,cosa){const cl=cliente(c.clienteId),u=me();return`${cl&&(cl.referente||cl.nome)?'Gentile '+(cl.referente||cl.nome)+',':'Buongiorno,'}\n\n${cosa} relativo a ${c.nome}.\n\nRestiamo a disposizione per rivederlo insieme.\n\nUn caro saluto,\n${u?u.nome:''}\nBTWN – Between Contract & Design`}
function icsEvento(e){const c=commessa(e.commessaId);const p2=x=>String(x).padStart(2,'0');const d=(e.data||today()).replace(/-/g,'');let dt;
  if(e.ora){const [h,m]=e.ora.split(':').map(Number);const end=new Date(2000,0,1,h+1,m);dt=`DTSTART:${d}T${p2(h)}${p2(m)}00\r\nDTEND:${d}T${p2(end.getHours())}${p2(end.getMinutes())}00`}else dt=`DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${addDays(e.data||today(),1).replace(/-/g,'')}`;
  const esc2=t=>String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  return`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//BTWN//Bussola//IT\r\nBEGIN:VEVENT\r\nUID:${e.id}@btwn-bussola\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z\r\n${dt}\r\nSUMMARY:${esc2(e.titolo+(c?' · '+c.nome:''))}\r\nLOCATION:${esc2(e.luogo)}\r\nDESCRIPTION:${esc2([e.tipo,c&&c.nome,e.note].filter(Boolean).join(' · '))}\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`}

  const T=Q.reduce((a,{q})=>{for(const k of ['acq','fatt','inc','daInc','sca','daFatt','costi','marg'])a[k]=(a[k]||0)+q[k];return a},{});
  const rs=S.rate.filter(r=>commessa(r.commessaId));const y=new Date().getFullYear();

function fieldHtml(f,v){
  const val=v[f.k]??f.def??'';const cls=f.wide?'wide':'';const req=f.req?'required':'';
  if(f.type==='select')return`<label class="${cls}">${f.l}${selectHtml(f.opts,val,`name="${f.k}" ${req}`)}</label>`;
  if(f.type==='images')return`<div class="${cls}"><label>${f.l}</label>${imagesField(f.k,val)}</div>`;
  if(f.type==='textarea')return`<label class="${cls}">${f.l}<textarea name="${f.k}">${esc(val)}</textarea></label>`;
  if(f.type==='checkbox')return`<label class="chk ${cls}"><input type="checkbox" name="${f.k}" ${val?'checked':''}>${f.l}</label>`;
  if(f.type==='multi')return`<div class="${cls}"><label>${f.l}</label><div class="multi" style="margin-top:6px">${f.opts.map(o=>{const v=typeof o==='object'?o.v:o,l=typeof o==='object'?o.l:esc(o);return`<label><input type="checkbox" name="${f.k}" value="${esc(v)}" ${(val||[]).includes(v)?'checked':''}>${l}</label>`}).join('')}</div></div>`;
  return`<label class="${cls}">${f.l}<input name="${f.k}" type="${f.type||'text'}" value="${esc(val)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''} ${f.type==='number'?'step="any"':''} ${req}></label>`;
}
function openForm({title,fields,values={},onSave,calc,onDelete,intro}){
  const d=$('#modal');
  d.innerHTML=`<form id="mf" novalidate><div class="modal-head"><h2>${esc(title)}</h2><button type="button" class="ghost icon-btn" data-close aria-label="Chiudi">${ic('x')}</button></div><div class="modal-body">${intro?`<div class="note" style="margin-top:0">${intro}</div>`:''}<div class="form-grid">${fields.map(f=>fieldHtml(f,values)).join('')}</div>${calc?'<div class="calculation" id="calc"></div>':''}<div id="formErr"></div><div class="form-footer">${onDelete?`<button type="button" class="danger" id="mdel" style="margin-right:auto">${ic('trash')}Elimina</button>`:''}<button type="button" data-close>Annulla</button><button class="primary" type="submit">Salva</button></div></div></form>`;
  const form=$('#mf');
  if(fields.some(f=>f.type==='images'))wireImages(form);
  const read=()=>{const o={};fields.forEach(f=>{if(f.type==='multi'){o[f.k]=[...form.querySelectorAll(`[name="${f.k}"]:checked`)].map(x=>x.value);return}const el=form.elements[f.k];if(!el)return;o[f.k]=f.type==='checkbox'?el.checked:f.type==='number'?(el.value===''?null:+el.value):el.value.trim()});return o};
  if(calc){const upd=()=>$('#calc').innerHTML=calc(read());form.addEventListener('input',upd);form.addEventListener('change',upd);upd()}
  d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.close());
  if(onDelete)$('#mdel').onclick=()=>{if(confirm('Eliminare definitivamente?')){onDelete();save();d.close();render();toast('Eliminato')}};
  form.onsubmit=e=>{e.preventDefault();const o=read();const miss=fields.filter(f=>f.req&&(o[f.k]===''||o[f.k]==null)).map(f=>f.l);if(miss.length){$('#formErr').innerHTML=`<div class="error">Compila: ${miss.join(', ')}</div>`;return}
    const res=onSave(o);if(res===false)return;save();d.close();render();toast('Salvato')};
  d.showModal();
  const first=form.querySelector('input:not([type=checkbox]),select,textarea');if(first)first.focus();
}

const FILES=new Map();let _db;
function idb(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('btwn-bussola-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
const idbTx=(mode,fn)=>idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('files',mode);const st=t.objectStore('files');const out=fn(st);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)}));
async function idbInit(){try{const all=await idbTx('readonly',st=>st.getAll());(all||[]).forEach(f=>FILES.set(f.id,{name:f.name,type:f.type,size:f.size,blob:f.blob,url:URL.createObjectURL(f.blob)}))}catch(e){console.warn('IndexedDB non disponibile',e)}}
async function putFile(blob,name){const id='f'+uid();await idbTx('readwrite',st=>st.put({id,name,type:blob.type,size:blob.size,blob}));FILES.set(id,{name,type:blob.type,size:blob.size,blob,url:URL.createObjectURL(blob)});return id}
async function delFileBlob(id){FILES.delete(id);try{await idbTx('readwrite',st=>st.delete(id))}catch(e){}}
function compressImage(file,max=1800,q=.82){return new Promise(res=>{if(!/^image\/(jpeg|png|webp)/.test(file.type)){res(file);return}const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cv.toBlob(b=>res(b&&b.size<file.size?b:file),'image/jpeg',q);URL.revokeObjectURL(img.src)};img.onerror=()=>res(file);img.src=URL.createObjectURL(file)})}
const imgSrc=ref=>{ref=String(ref||'').trim();if(ref.startsWith('idb:')){const f=FILES.get(ref.slice(4));return f?f.url:''}return ref};
const blobToDataURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB';
function imagesField(name,val){const list=String(val||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);return`<input type="hidden" name="${name}" value="${esc(list.join('\n'))}"><div class="thumbs-edit" data-for="${name}" style="display:flex;flex-wrap:wrap;gap:8px;margin:6px 0">${list.map((x,i)=>`<div style="position:relative;width:96px;height:96px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f3f5f1">${imgSrc(x)?`<img src="${esc(imgSrc(x))}" style="width:100%;height:100%;object-fit:cover">`:`<span class="subtle" style="font-size:10px;padding:4px;display:block;word-break:break-all">${esc(x)}</span>`}${i===0?'<span class="tag" style="position:absolute;left:4px;top:4px">principale</span>':''}<button type="button" class="icon-btn" data-img-del="${name}" data-i="${i}" style="position:absolute;right:2px;top:2px;background:#fff">${ic('x')}</button>${i?`<button type="button" class="icon-btn" data-img-first="${name}" data-i="${i}" title="Rendi principale" style="position:absolute;left:2px;bottom:2px;background:#fff">${ic('arrow')}</button>`:''}</div>`).join('')}</div><div class="actions"><label class="small" style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer;color:var(--ink);font-weight:600">${ic('upload')}Carica foto<input type="file" accept="image/*" multiple data-img-up="${name}" style="display:none"></label><input placeholder="…oppure incolla un link https://" data-img-url="${name}" style="flex:1;min-width:200px"></div>`}
function wireImages(form){
  const set=(name,list)=>{form.querySelector(`input[type=hidden][name="${name}"]`).value=list.join('\n');const box=form.querySelector(`.thumbs-edit[data-for="${name}"]`).parentElement;const tmp=document.createElement('div');tmp.innerHTML=imagesField(name,list.join('\n'));box.querySelector(`input[type=hidden][name="${name}"]`).remove();box.querySelector(`.thumbs-edit[data-for="${name}"]`).remove();box.querySelector('.actions').remove();[...tmp.children].forEach(ch=>box.appendChild(ch))};
  const get=name=>form.querySelector(`input[type=hidden][name="${name}"]`).value.split('\n').filter(Boolean);
  form.addEventListener('click',e=>{const d=e.target.closest('[data-img-del]');if(d){const l=get(d.dataset.imgDel);l.splice(+d.dataset.i,1);set(d.dataset.imgDel,l)}const f=e.target.closest('[data-img-first]');if(f){const l=get(f.dataset.imgFirst);const [x]=l.splice(+f.dataset.i,1);l.unshift(x);set(f.dataset.imgFirst,l)}});
  form.addEventListener('change',async e=>{const up=e.target.closest('[data-img-up]');if(up){const name=up.dataset.imgUp;const l=get(name);toast('Caricamento foto…');for(const file of up.files){const b=await compressImage(file);l.push('idb:'+await putFile(b,file.name))}set(name,l);toast('Foto caricate')}
    const u=e.target.closest('[data-img-url]');if(u&&u.value.trim()){const name=u.dataset.imgUrl;const l=get(name);l.push(u.value.trim());set(name,l)}});

<script>(function(){var KEY=${JSON.stringify(KEY)},ITEMS=${JSON.stringify(items).replace(/</g,'\\u003c')},TITLE=${JSON.stringify(pg.titolo||'').replace(/</g,'\\u003c')},MAIL=${JSON.stringify(pg.email||'')};
var st={react:{},cmt:{},pick:{},nome:"",note:""};try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)st=Object.assign(st,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}sum()}
var R={si:"Mi piace",forse:"Da rivedere",no:"No"};
document.querySelectorAll(".prod").forEach(function(el){var id=el.getAttribute("data-item");el.querySelectorAll(".react button").forEach(function(b){b.setAttribute("aria-pressed",st.react[id]===b.dataset.r?"true":"false");b.onclick=function(){st.react[id]=st.react[id]===b.dataset.r?null:b.dataset.r;el.querySelectorAll(".react button").forEach(function(x){x.setAttribute("aria-pressed",st.react[id]===x.dataset.r?"true":"false")});save()}});var c=el.querySelector(".cmt");c.value=st.cmt[id]||"";c.oninput=function(){st.cmt[id]=c.value;save()};var r=el.querySelector(".choose input");if(r){if(st.pick[r.name]===id)r.checked=true;r.onchange=function(){st.pick[r.name]=id;save()}}});
var n=document.getElementById("fNome"),t=document.getElementById("fNote");n.value=st.nome;t.value=st.note;n.oninput=function(){st.nome=n.value;save()};t.oninput=function(){st.note=t.value;save()};
function text(){var L=[TITLE+" · le mie scelte",""];if(st.nome)L.push("Nome: "+st.nome,"");var picks=Object.keys(st.pick);if(picks.length){L.push("SCELTE");picks.forEach(function(g){var it=ITEMS[st.pick[g]];if(it)L.push("- "+it.a+": "+it.n)});L.push("")}var any=false;Object.keys(ITEMS).forEach(function(id){var r=st.react[id],c=st.cmt[id];if(r||c){if(!any){L.push("PREFERENZE");any=true}L.push("- "+ITEMS[id].a+" / "+ITEMS[id].n+(r?": "+R[r]:"")+(c?" — "+c:""))}});if(any)L.push("");if(st.note)L.push("NOTE",st.note);if(L.length<=2)L.push("Nessuna scelta ancora.");return L.join("\\n")}
function sum(){document.getElementById("sum").textContent=text();var m=document.getElementById("mail");if(m)m.href="mailto:"+MAIL+"?subject="+encodeURIComponent(TITLE+" · le mie scelte")+"&body="+encodeURIComponent(text())}
document.getElementById("copy").onclick=function(){var msg=document.getElementById("msg");(navigator.clipboard?navigator.clipboard.writeText(text()):Promise.reject()).then(function(){msg.textContent="Copiato"},function(){msg.textContent="Seleziona il testo e copialo"})};
document.getElementById("reset").onclick=function(){if(confirm("Azzerare tutte le scelte?")){st={react:{},cmt:{},pick:{},nome:"",note:""};save();location.reload()}};
var lb=document.getElementById("lb");document.addEventListener("click",function(e){var i=e.target.closest("[data-zoom]");if(i){lb.querySelector("img").src=i.src;lb.querySelector("img").alt=i.alt;lb.classList.add("on")}else if(e.target.closest("#lb"))lb.classList.remove("on")});document.addEventListener("keydown",function(e){if(e.key==="Escape")lb.classList.remove("on")});
sum()})();<\/script></body></html>`;
}
function apriPagina(p){const w=window.open('','_blank');if(!w){toast('Consenti i pop-up per vedere l\'anteprima');return}w.document.write(paginaHTML(p,true));w.document.close()}
async function scaricaPagina(p){const slug=((p.pagina&&p.pagina.titolo)||'pagina-cliente').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const refs=new Set();(p.righe||[]).forEach(r=>String(r.img||'').split('\n').forEach(x=>{if(x.trim().startsWith('idb:'))refs.add(x.trim().slice(4))}));String((p.pagina||{}).planimetria||'').split('\n').forEach(x=>{if(x.trim().startsWith('idb:'))refs.add(x.trim().slice(4))});
  const map={};for(const id of refs){const f=FILES.get(id);if(f)map[id]=await blobToDataURL(f.blob)}
  const html=paginaHTML(p,false,ref=>{ref=String(ref||'').trim();return ref.startsWith('idb:')?(map[ref.slice(4)]||''):ref});
  download(slug+'.html',html,'text/html');toast(`Pagina scaricata: ${slug}.html (${kb(html.length)}, foto incluse)`)}

function diffRilievoBox(c){if(c.rilievo==='speciale')return'';const d=c.diffRil||{},ps=prevDi(c.id),acc=ps.find(p=>p.stato==='Accettato'),t=acc&&prevCalc(acc);
  const fld=(k,l,ph)=>`<label>${l}<input type="number" step="any" value="${d[k]??''}" placeholder="${ph}" data-change="diffRil" data-id="${c.id}" data-k="${k}"></label>`;
  return`<div class="calc-grid" style="margin:4px 0 6px">${fld('cliente','Differenziale chiesto al cliente (€ + IVA)','es. 700')}${fld('listino','Aumento di listino del brand (€, non al cliente)','es. 300')}</div>
  <div class="note" style="margin-bottom:8px">${t?`Contratto firmato ${eur(t.netto)} → aggiornato <b>${eur(t.netto+(+d.cliente||0))}</b> + IVA. `:''}${+d.listino?`Nella conferma d'ordine il costo salirà di circa <b>${eur(d.listino)}</b> per aumento di listino: al controllo delle conferme non è un errore.`:'L\'aumento di listino del brand si segna a parte: spiega la differenza che arriverà nella conferma d\'ordine.'}</div>`}
function workflowView(c){
  c.steps=c.steps||{};
  const est=c.esterni||[], rip=c.ripristini||[];
  const lnk={homebook:`<button class="small" data-act="nav" data-h="#/commessa/${c.id}/documenti">${ic('upload')}Carica e invia il contratto</button>`,progettazione:`<button class="small" data-act="newEsterno" data-id="${c.id}">${ic('plus')}Fattura agenzia</button><button class="small" data-act="nav" data-h="#/commessa/${c.id}/preventivi">${ic('calc')}Preventivi</button>`,presentazione:`<button class="small" data-act="newEvento" data-c="${c.id}">${ic('cal')}Fissa</button>`,firma:`<button class="small adm" data-act="nav" data-h="#/commessa/${c.id}/pagamenti">${ic('euro')}Rate</button>`,ordine:`<button class="small" data-act="nav" data-h="#/commessa/${c.id}/ordini">${ic('box')}Ordini</button>`,verbale:`<button class="small" data-act="newRipristino" data-id="${c.id}">${ic('plus')}Da riordinare / sistemare</button>`,ripristino:`<button class="small" data-act="newRipristino" data-id="${c.id}">${ic('plus')}Da riordinare / sistemare</button>`};
  const extra=id=>{
    if(id==='progettazione')return est.length?`<div class="table-wrap" style="margin-top:6px"><table><thead><tr><th>Agenzia</th><th>Brand</th><th>Fattura</th><th class="right-txt">Importo</th><th></th></tr></thead><tbody>${est.map((x,i)=>`<tr><td>${esc(x.agenzia)}</td><td>${esc(x.brand||'—')}</td><td>${esc(x.fattura||'—')}<small>${fd(x.data)}</small></td><td class="amount right-txt">${eur2(x.importo)}</td><td><button class="icon-btn" data-act="editEsterno" data-id="${c.id}" data-i="${i}">${ic('edit')}</button></td></tr>`).join('')}</tbody></table></div>`:'';
    if(id==='raccolta')return`<div class="calc-grid" style="margin:4px 0 8px"><label>Budget del cliente (€)<input type="number" step="1000" value="${c.budget??''}" data-change="budget" data-id="${c.id}" placeholder="dalla prima call"></label><label>Note dalla call (stile, esigenze, tempi)<textarea rows="2" data-change="noteRaccolta" data-id="${c.id}">${esc(c.noteRaccolta||'')}</textarea></label></div>`;
    if(id==='esito'){const fee=+c.hbFee||HB_FEE,rp=+c.hbRitorno||0,so=+c.hbSoglia||0,ps=prevDi(c.id),pr=ps.find(p=>p.stato==='Accettato')||ps[0],t=pr&&prevCalc(pr);if(!rp)return`<div class="note">Nessun ritorno dell'Home Book previsto per questa commessa (si imposta in Configura → Condizioni).</div>`;const off=t?t.offerta:0,ok=t&&(!so||off>=so);return`<div class="note" style="margin-bottom:8px">Ritorno Home Book: <b>${rp}%</b> di ${eur(fee)} = <b>${eur(fee*rp/100)}</b>${so?` se l'arredo confermato è almeno ${eur(so)}`:''}.${t?` Offerta ${pr.stato==='Accettato'?'accettata':'attuale'}: ${eur(off)} → ${ok?'<b>ritorno spettante</b>, già scalato dall\'offerta':`<b>sotto soglia</b>: mancano ${eur(so-off)}`}.`:' Nessun preventivo ancora.'}</div>`}
    if(id==='impianti')return`<div class="toolbar" style="margin:4px 0 8px"><span class="subtle">Servono modifiche agli impianti per l'arredo?</span><div class="seg"><button class="${c.impianti==='si'?'active':''}" data-act="impiantiMode" data-id="${c.id}" data-v="si">Sì</button><button class="${c.impianti==='no'?'active':''}" data-act="impiantiMode" data-id="${c.id}" data-v="no">No</button></div></div>${c.impianti?'':'<div class="note">Rispondi dopo la presentazione dell\'Home Book: con "Sì" compaiono gli schemi da preparare e inviare.</div>'}`;
    if(id==='rilievo')return diffRilievoBox(c)+`<div class="toolbar" style="margin:4px 0 8px"><div class="seg"><button class="${c.rilievo!=='speciale'?'active':''}" data-act="rilievoMode" data-id="${c.id}" data-v="rilevabile">Casa rilevabile</button><button class="${c.rilievo==='speciale'?'active':''}" data-act="rilievoMode" data-id="${c.id}" data-v="speciale">Non rilevabile: procedura speciale</button></div></div>${c.rilievo==='speciale'?'<div class="note" style="background:#fff7ea;color:#9b784c">Eccezione: ordiniamo sui disegni tecnici. Il cliente si obbliga in solido a farli rispettare; se la merce non ci sta, tutte le spese sono sue.</div>':''}`;
    if(id==='op_capitolato')return`<label style="margin-bottom:8px">Come entra l'arredo${selectHtml(['','Nel prezzo di vendita dell\'appartamento','On top al prezzo di vendita','Metà sviluppatore, metà cliente'],c.capFormula||'',`data-change="capFormula" data-id="${c.id}"`)}</label>`;
    if(id==='op_retro'){const gg=+c.retroGiorni||120;const lim=c.dataFiniti?addDays(c.dataFiniti,-gg):'';return`<div class="calc-grid" style="margin-bottom:8px"><label>Appartamenti finiti per il<input type="date" data-change="retro" data-id="${c.id}" data-k="dataFiniti" value="${esc(c.dataFiniti||'')}"></label><label>Giorni tra rilievo e montaggio finito<input type="number" data-change="retro" data-id="${c.id}" data-k="retroGiorni" value="${gg}"></label></div>${lim?`<div class="note">Gli appartamenti devono essere finiti e rilevabili entro il <b>${fd(lim)}</b>${daysTo(lim)<0?' <span class="tag red">data superata</span>':' · tra '+daysTo(lim)+' giorni'}.</div>`:''}`}
    if(id==='op_montaggio'){const l=c.logistica||{};return`<div class="kv"><span>Società di logistica</span><b>${esc(l.societa||'—')}${l.importo?' · '+eur(l.importo):''}</b></div>${l.note?`<p class="subtle">${esc(l.note)}</p>`:''}<div style="margin:8px 0"><button class="small" data-act="logistica" data-id="${c.id}">${ic('edit')}Contratto logistica</button></div>`}
    if(['ordine','magazzino','op_ordine','op_magazzino'].includes(id))return ordiniMini(c)+`<div style="margin-bottom:8px"><label class="small" style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer;font-weight:600;background:#fff">${ic('upload')}Carica conferma d'ordine<input type="file" accept="application/pdf,.pdf" data-change="confUpload" data-c="${c.id}" style="display:none"></label></div>`;
    if(id==='verbale'||id==='ripristino')return rip.length?`<div class="table-wrap" style="margin-top:6px"><table><thead><tr><th>Da riordinare / sistemare</th><th>Azienda</th><th>Stato</th><th>Intervento</th><th></th></tr></thead><tbody>${rip.map((x,i)=>`<tr><td>${esc(x.descrizione)}</td><td>${esc(x.azienda||'—')}</td><td>${selectHtml(STATI_RIPRISTINO,x.stato,`class="inline-select" data-change="ripStato" data-id="${c.id}" data-i="${i}"`)}</td><td>${fd(x.data)}</td><td><button class="icon-btn" data-act="editRipristino" data-id="${c.id}" data-i="${i}">${ic('edit')}</button></td></tr>`).join('')}</tbody></table></div>`:'';
    return'';
  };

    await inviaOutlook({to:cl&&cl.email,subject:`${p.pagina.titolo||c.nome} · il tuo progetto d'arredo`,body:testoMail(c,"in allegato trovi la pagina del tuo progetto d'arredo: aprila nel browser, scegli tra le alternative, lascia le tue preferenze e inviaci il riepilogo. Il progetto è quello"),attachments:[{name:nome,type:'text/html',blob:new Blob([html],{type:'text/html'})}],nomeFile:`Mail ${p.pagina.titolo||'pagina cliente'}`})},
  delFile:d=>{const c=commessa(d.id);if(confirm('Rimuovere il documento?')){const [f]=c.files.splice(+d.i,1);if(f&&f.fileId)delFileBlob(f.fileId);save();render()}},
  clearDemo:()=>{if(!confirm('Rimuovere unità, rate e appuntamenti di esempio? Commesse, clienti e brand restano.'))return;S.unita=[];S.rate=[];S.eventi=[];S.demo=false;save();render();toast('Esempi rimossi')},
  keepDemo:()=>{S.demo=false;save();render()},
  export:async()=>{const files=[];for(const [id,f] of FILES)files.push({id,name:f.name,type:f.type,data:await blobToDataURL(f.blob)});const json=JSON.stringify(Object.assign({},S,{_files:files}));download(`btwn-bussola-backup-${today()}.json`,json,'application/json');toast(`Backup esportato (${kb(json.length)}, ${files.length} file)`)},
  exportCsv:()=>{const rows=[['Commessa','Rata','Intestatario','N. fattura','Data fattura','Imponibile','IVA %','Totale','Scadenza','Stato','Data incasso']];S.rate.forEach(r=>{const c=commessa(r.commessaId);if(!c)return;rows.push([c.nome,r.descrizione,r.controparte||'',r.numero||'',r.dataFattura||'',String(r.importo).replace('.',','),ivaR(r),String(Math.round(totR(r)*100)/100).replace('.',','),r.scadenza||'',r.stato==='Prevista'?'Da emettere':r.stato==='Fatturata'?'Da incassare':'Incassata',r.dataIncasso||''])});download(`btwn-fatture-${today()}.csv`,'\ufeff'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv')},
  import:()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!d.commesse||!d.users)throw new Error();if(!confirm('Sostituire tutti i dati attuali con il backup?'))return;const fl=d._files||[];delete d._files;S=d;save();(async()=>{for(const f of fl){const b=await (await fetch(f.data)).blob();await idbTx('readwrite',st=>st.put({id:f.id,name:f.name,type:f.type,size:b.size,blob:b}));FILES.set(f.id,{name:f.name,type:f.type,size:b.size,blob:b,url:URL.createObjectURL(b)})}render()})();if(!me())localStorage.setItem(SESSION,S.users[0].id);render();toast('Backup importato')}).catch(()=>toast('File di backup non valido'))};i.click()},
  resetDemo:()=>{if(confirm('Sostituire tutti i dati con quelli dimostrativi?')){const name=me().nome;S=seed();const u=S.users.find(x=>x.nome===name)||S.users[0];localStorage.setItem(SESSION,u.id);save();go('#/dashboard');toast('Dati dimostrativi ripristinati')}},
  wipe:()=>{if(confirm('Cancellare TUTTI i dati? Esporta prima un backup.')&&confirm('Confermi la cancellazione?')){const u=me();S={version:1,demo:false,azienda:S.azienda,users:[u],clienti:[],commesse:[],unita:[],rate:[],eventi:[],fornitori:[]};save();go('#/dashboard');toast('Dati cancellati')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.closest('dialog')&&!t.closest('#app'))return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t.dataset,t)}});
document.addEventListener('change',e=>{
  const gt=e.target.closest('[data-cl][data-ls][data-f]');
  if(gt){const c=commessa(gt.dataset.cl),r=(c[gt.dataset.ls]||[]).find(x=>x.id===gt.dataset.r);if(!r)return;const v=gt.value;r[gt.dataset.f]=gt.type==='number'?(v===''?null:+String(v).replace(',','.')):v;save();setTimeout(()=>{render.keepScroll=true;render()},0);return}
  const g=e.target.closest('[data-pr][data-f]');
  if(g){const p=byId('preventivi',g.dataset.pr),r=p&&p.righe.find(x=>x.id===g.dataset.r);if(!r)return;const f=g.dataset.f;
    let v=g.value;if(f==='scAcq'){if(String(v).includes('+')){r.scAcqF=String(v).replace(/\s/g,'');v=scontoEff(v)}else{r.scAcqF='';v=v===''?null:+String(v).replace('%','').replace(',','.')}}else if(['qta','listino','scCli'].includes(f))v=v===''?null:+String(v).replace(',','.');r[f]=v;
    if(f==='brand'||f==='acquista'){const fo=fornByName(r.brand);if(fo&&(f==='brand'||fo.scontoRiv||fo.scontoRivCamp)){const sa=scontoBrand(fo,r,p);if(sa!=null&&sa!==''){r.scAcqF=String(sa).includes('+')?String(sa):'';r.scAcq=scontoEff(sa)}if(fo.scontoCli!=null&&fo.scontoCli!=='')r.scCli=+fo.scontoCli;if(sa!=null&&sa!=='')setTimeout(()=>toast(`${fo.nome}: sconto d'acquisto ${sa}${String(sa).includes('+')?' (eff. '+scontoEff(sa)+'%)':'%'}${r.acquista==='Partner'&&fo.scontoRiv?' tramite '+(fo.rivNome||'rivenditore'):''}${p.campione&&fo.scontoCamp?' (appartamento campione)':''} caricato`),50)}if(f==='brand'&&String(v).toUpperCase()==='BTWN'&&r.scAcq==null)r.scAcq=0}
    save();setTimeout(()=>{render.keepScroll=true;render()},0);return}
  const t=e.target.closest('[data-change]');if(!t)return;const d=t.dataset;
  if(d.change==='budget'||d.change==='noteRaccolta'){const c=commessa(d.id);if(d.change==='budget'){c.budget=t.value===''?null:+t.value;if(c.budget){c.steps=c.steps||{};if(!c.steps.budget)c.steps.budget=today()}}else c.noteRaccolta=t.value;save();render.keepScroll=true;render();toast(d.change==='budget'?'Budget salvato':'Note salvate');return}
  if(d.change==='diffRil'){const c=commessa(d.id);c.diffRil=c.diffRil||{};c.diffRil[d.k]=t.value===''?null:+t.value;if(c.diffRil.cliente!=null||c.diffRil.listino!=null){c.steps=c.steps||{};if(!c.steps.ril_diff)c.steps.ril_diff=today()}save();render.keepScroll=true;render();toast('Differenziale salvato');return}
  if(d.change==='docTipoUp'){ui.docTipo=t.value;return}
  if(d.change==='docRinomina'){const c=commessa(d.id),f=c.files[+d.i];if(!t.value)return;const nome=nomeDoc(c,t.value,f.nome);f.nome=nome;f.tipo=t.value;const F=f.fileId&&FILES.get(f.fileId);if(F){F.name=nome;idbTx('readwrite',st=>st.put({id:f.fileId,name:nome,type:F.type,size:F.size,blob:F.blob}))}save();render.keepScroll=true;render();toast('Rinominato: '+nome);return}
  if(d.change==='filtroStato'){ui.filtroStato=t.value;render()}
  if(d.change==='statoUnita'){const u=byId('unita',d.id);u.stato=t.value;save();render();toast(u.codice+' → '+t.value)}
  if(d.change==='statoRata'){const r=byId('rate',d.id);r.stato=t.value;save();render();toast('Rata: '+t.value)}
  if(d.change==='prevStato'){const p=byId('preventivi',d.id);if(t.value==='Accettato'){t.value=p.stato;A.accettaPrev({id:p.id});return}p.stato=t.value;save();render();toast('Preventivo: '+t.value)}
  if(d.change==='ordineStato'){const o=byId('ordini',d.id);o.stato=t.value;save();render.keepScroll=true;render();toast(o.fornitore+' → '+t.value)}
  if(d.change==='arrPrezzo'){const c=commessa(d.id);c.arrPrezzi=Object.assign({},c.arrPrezzi,{[d.k]:t.value===''?null:+t.value});save();render.keepScroll=true;render()}
  if(d.change==='capFormula'){const c=commessa(d.id);c.capFormula=t.value;save();render.keepScroll=true;render()}
  if(d.change==='retro'){const c=commessa(d.id);c[d.k]=t.type==='number'?+t.value:t.value;save();render.keepScroll=true;render()}
  if(d.change==='diffCfg'){const c=commessa(d.id);c.diffCfg=Object.assign(diffCfg(c),{[d.k]:t.type==='number'?+t.value:t.value});save();render.keepScroll=true;render()}
  if(d.change==='formula'){const c=commessa(d.id);c.formula=t.value;save();render.keepScroll=true;render()}
  if(d.change==='cfgTipo'){const c=commessa(d.id);c.cfgTipo=t.value;save();render.keepScroll=true;render()}
  if(d.change==='statoVar'){const u=byId('unita',d.id);u.statoVar=t.value;u.varianti=t.value!==SV_NESSUNA;save();render.keepScroll=true;render();toast(u.codice+' · '+t.value)}
  if(d.change==='confUpload'){const f=t.files[0];if(f)caricaConferma(commessa(d.c),d.o||null,f);t.value='';return}
  if(d.change==='uploadFornDocs'){const f=byId('fornitori',d.id);(async()=>{for(const file of t.files){const id=await putFile(file,file.name);(f.files=f.files||[]).push({nome:file.name,data:today(),fileId:id,size:file.size})}save();render.keepScroll=true;render();toast('Caricato')})();return}
  if(d.change==='margObj'){S.impostazioni=Object.assign({},S.impostazioni,{margine:+t.value||30});save();render.keepScroll=true;render();toast('Margine obiettivo: '+margObj()+'%')}
  if(d.change==='uploadDocs'){uploadDocs(commessa(d.id),[...t.files]);return}
  if(d.change==='step'){const c=commessa(d.id);c.steps=c.steps||{};if(t.checked){c.steps[d.k]=today();if(+d.f>c.fase)c.fase=+d.f}else delete c.steps[d.k];save();render.keepScroll=true;render()}
  if(d.change==='ripStato'){const c=commessa(d.id);c.ripristini[+d.i].stato=t.value;save();render.keepScroll=true;render();toast('Ripristino: '+t.value)}
  if(d.change==='doc'){const c=commessa(d.id);c.docs=c.docs||{};c.docs[d.i]=t.checked?1:0;save();render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}});

load();idbInit().then(render);
