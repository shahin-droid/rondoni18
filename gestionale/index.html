const tagStato=s=>`<span class="tag ${({Pipeline:'blue',Attiva:'',Sospesa:'amber',Chiusa:'gray',Persa:'red'})[s]||''}">${esc(s)}</span>`;
const tagUnita=s=>{const i=STATI_UNITA.indexOf(s);return`<span class="tag ${i===0?'amber':i>=6?'gray':i>=3?'':'blue'}">${esc(s)}</span>`};
const tagRata=r=>{if(r.stato==='Incassata')return'<span class="tag">Incassata</span>';if(r.scadenza&&daysTo(r.scadenza)<0)return`<span class="tag red">${r.stato} · scaduta</span>`;return`<span class="tag ${r.stato==='Fatturata'?'amber':'gray'}">${r.stato}</span>`};
const empty=(icon,t,s,btn='')=>`<div class="empty">${ic(icon)}<b>${t}</b>${s}${btn?'<div style="margin-top:16px">'+btn+'</div>':''}</div>`;
const progress=c=>`<div class="progress"><span style="width:${Math.round(c.fase/fasiFor(c).length*100)}%"></span></div>`;
const selectHtml=(opts,val,attrs='')=>`<select ${attrs}>${opts.map(o=>{const v=typeof o==='object'?o.v:o,l=typeof o==='object'?o.l:o;return`<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
function diffCfg(c){return Object.assign({tipo:'fasce',sconto:null,fasce:'',paga:'cliente'},c.diffCfg||{})}
const fasceList=c=>String(diffCfg(c).fasce||'').split(';').map(x=>x.split(':').map(y=>y.trim())).filter(x=>x[0]&&x[1]!==undefined&&x[1]!=='');
const politicaOk=c=>{const g=diffCfg(c);return g.tipo==='fisso'?g.sconto!=null&&g.sconto!=='':fasceList(c).length>0};
function scontoDiff(c,d){if(!politicaOk(c))return null;const cfg=diffCfg(c);if(cfg.tipo==='fisso')return +cfg.sconto||0;let last=0;for(const [lim,sc] of fasceList(c)){if(lim==='oltre')return +sc;if(d<=+lim)return +sc;last=+sc}return last}
function listinoCapitolato(c,u){return (c.pack||[]).filter(r=>r.tipologicoId&&r.tipologicoId===u.tipologicoId&&r.elemento!=='Voucher arredo').reduce((a,r)=>a+(+r.listino||0),0)}
function diffUnita(c,u){const cap=listinoCapitolato(c,u);if(!u.listinoProgetto)return null;const d=(+u.listinoProgetto)-cap;const sc=d>0?scontoDiff(c,d):0;return{cap,prog:+u.listinoProgetto,d,sc,netto:d>0?(sc==null?null:d*(1-sc/100)):0}}
function varCfg(c){return Object.assign({feeCli:FEE.varianti*100,feeSvil:FEE.consulenza*100,svilSu:'tutti',omaggioN:0},c.varCfg||{})}
function varFees(c){
  const cfg=varCfg(c),us=unitaDi(c.id),on=c.servizi.includes(SV.var);if(!on)return{cli:0,svil:0,omaggio:0,nVar:0,nOm:0,cfg};
  const vu=us.filter(u=>u.varianti).sort((a,b)=>(a.preliminare||'9').localeCompare(b.preliminare||'9'));
  const om=new Set(vu.slice(0,+cfg.omaggioN||0).map(u=>u.id));
  const cli=vu.filter(u=>!om.has(u.id)).reduce((a,u)=>a+(+u.prezzo||0)*cfg.feeCli/100,0);
  const omaggio=vu.filter(u=>om.has(u.id)).reduce((a,u)=>a+(+u.prezzo||0)*cfg.feeCli/100,0);
  const base=(cfg.svilSu==='tutti'?us:vu).reduce((a,u)=>a+(+u.prezzo||0),0);
  return{cli,svil:base*cfg.feeSvil/100+omaggio,omaggio,nVar:vu.length,nOm:om.size,om,cfg};
}
function packCalc(c,r){const t=(c.tipologici||[]).find(x=>x.id===r.tipologicoId);const n=t?+t.unita||0:0;const L=+r.listino||0;const prezzo=L*(1-(+r.scVend||0)/100), costo=L*(1-(+r.scAcq||0)/100);const ades=(c.formula==='scontato'?(r.adesione!=null&&r.adesione!==''?+r.adesione:(c.conversione!=null&&c.conversione!==''?+c.conversione:100)):100)/100;const q=n*ades;return{n,prezzo,costo,marg:prezzo-costo,q,tot:q*prezzo,margTot:q*(prezzo-costo)}}
function quotaServizi(c,tot){const v=+c.quotaVal||0;if(!v)return 0;if((c.quotaTipo||'perc')==='perc')return tot*v/100;return (c.tipologici||[]).reduce((a,t)=>a+(+t.unita||0),0)*v}
function serviziTot(c){
  const on=k=>c.servizi.includes(SV[k]);
  const arr=on('arr')&&c.arrLivello?(+((c.arrPrezzi||{})[c.arrLivello])||0):0;
  const riass=on('lev')&&on('arr')?arr*(+c.riassorbimento||0)/100:0;
  const mk=on('mk')?(c.marketing||[]).reduce((a,x)=>a+(+x.qta||1)*(+x.prezzo||0),0):0;
  const lv=on('lev')?(c.pack||[]).reduce((a,r)=>{const x=packCalc(c,r);a.tot+=x.tot;a.marg+=x.margTot;return a},{tot:0,marg:0}):{tot:0,marg:0};
  const cfg=on('cfg')?(c.cfgVoci||[]).reduce((a,x)=>a+(+x.qta||1)*(+x.prezzo||0),0):0;
  return{arr,mk,lev:lv.tot+(on('lev')?quotaServizi(c,lv.tot):0)-riass,levMarg:lv.marg,cfg,riass};
}
function commessaNumeri(c){
  const us=unitaDi(c.id), rs=rateDi(c.id);
  const pack=us.reduce((a,u)=>a+(+u.pack||0),0);
  const prezzi=us.reduce((a,u)=>a+(+u.prezzo||0),0);
  const vf=varFees(c);const feeVar=vf.cli, feeCons=vf.svil;
  const sv=serviziTot(c);
  const incassato=rs.filter(r=>r.stato==='Incassata').reduce((a,r)=>a+r.importo,0);
  const aperto=rs.filter(r=>r.stato!=='Incassata').reduce((a,r)=>a+r.importo,0);
  const valore=c.valore!=null&&c.valore!==''?+c.valore:(pack+feeVar+feeCons+sv.arr+sv.mk+sv.lev+sv.cfg);
  return{us,rs,pack,prezzi,feeVar,feeCons,incassato,aperto,valore,vf,sv};
}

lim)}${pre?`<small style="color:${dl<0?'var(--red)':dl<=30?'var(--orange)':'inherit'}">${dl<0?'superato da '+(-dl)+' gg':'tra '+dl+' gg'}</small>`:'<small>ordine confermato</small>'}`:'—'}</td><td><div class="actions"><button class="icon-btn" title="Genera rate" data-act="genRate" data-id="${c.id}" data-u="${u.id}">${ic('euro')}</button><button class="icon-btn" title="Modifica" data-act="editUnita" data-id="${u.id}">${ic('edit')}</button></div></td></tr>`}).join('')}</tbody></table></div>`:empty('home2','Nessuna unità','Aggiungi le unità della commessa una per una o in blocco.',`<button class="primary" data-act="bulkUnita" data-id="${c.id}">Genera unità</button>`)}</div>`;

function rateTable(rs,showCommessa){
  if(!rs.length)return empty('euro','Nessuna rata','Genera il piano dal modello contrattuale o aggiungi una rata.');
  rs=[...rs].sort((a,b)=>(a.scadenza||'9999').localeCompare(b.scadenza||'9999'));
  return`<div class="table-wrap"><table><thead><tr><th>Rata</th>${showCommessa?'<th>Commessa</th>':''}<th>Unità</th><th>%</th><th class="right-txt">Importo</th><th>Scadenza</th><th>Stato</th><th></th></tr></thead><tbody>${rs.map(r=>{const u=r.unitaId&&byId('unita',r.unitaId),c=commessa(r.commessaId);return`<tr><td>${esc(r.descrizione)}<small>${esc(r.quando||'')}</small></td>${showCommessa?`<td>${c?`<button class="link" data-act="nav" data-h="#/commessa/${c.id}/pagamenti">${esc(c.nome)}</button>`:'—'}</td>`:''}<td>${u?esc(u.codice):'—'}</td><td>${r.perc?r.perc+'%':'—'}</td><td class="amount right-txt">${eur2(r.importo)}</td><td>${fd(r.scadenza)}${r.scadenza&&r.stato!=='Incassata'?`<small>${daysTo(r.scadenza)<0?'scaduta da '+(-daysTo(r.scadenza))+' gg':'tra '+daysTo(r.scadenza)+' gg'}</small>`:''}</td><td>${selectHtml(STATI_RATA,r.stato,`class="inline-select" data-change="statoRata" data-id="${r.id}"`)} ${r.stato!=='Incassata'&&r.scadenza&&daysTo(r.scadenza)<0?'<span class="tag red">scaduta</span>':''}</td><td><button class="icon-btn" data-act="editRata" data-id="${r.id}" title="Modifica">${ic('edit')}</button></td></tr>`}).join('')}</tbody></table></div>`;
}

const stripe={Rilievo:'blue',Montaggio:'amber',Consegna:'amber',Scadenza:'red'};
function eventoRow(e,showDate){const c=commessa(e.commessaId);return`<div class="agenda-item ${e.fatto?'done':''}"><div class="agenda-time">${showDate?`<span class="subtle" style="font-weight:500">${fd(e.data)}</span><br>`:''}${e.ora||'—'}</div><div class="agenda-stripe ${stripe[e.tipo]||''}"></div><div class="agenda-content"><b>${esc(e.titolo)}</b><small>${esc(e.tipo)}${c?' · '+esc(c.nome):''}${e.luogo?' · '+esc(e.luogo):''}${!showDate&&daysTo(e.data)>0?' · '+fd(e.data):''}${!showDate&&daysTo(e.data)===0?' · oggi':''}</small></div><div class="actions"><button class="icon-btn" title="${e.fatto?'Riapri':'Segna fatto'}" data-act="toggleEvento" data-id="${e.id}">${ic('check')}</button><button class="icon-btn" title="Modifica" data-act="editEvento" data-id="${e.id}">${ic('edit')}</button></div></div>`}
function vAgenda(){
  const t=today();
  const list=S.eventi.filter(e=>ui.agendaPast?e.data<t:e.data>=t).sort((a,b)=>ui.agendaPast?(b.data+b.ora).localeCompare(a.data+a.ora):(a.data+a.ora).localeCompare(b.data+b.ora));
  const days={};list.forEach(e=>(days[e.data]=days[e.data]||[]).push(e));
  return`<div class="head"><div><div class="eyebrow">Calendario operativo</div><h1>Agenda</h1><p>Rilievi, sopralluoghi, montaggi, consegne e incontri.</p></div><button class="primary" data-act="newEvento">${ic('plus')}Appuntamento</button></div>
  <div class="toolbar"><div class="seg"><button class="${!ui.agendaPast?'active':''}" data-act="agendaPast" data-v="0">Prossimi</button><button class="${ui.agendaPast?'active':''}" data-act="agendaPast" data-v="1">Passati</button></div></div>
  <div class="panel">${Object.keys(days).length?Object.entries(days).map(([d,es])=>`<div class="agenda-day">${d===t?'Oggi · ':daysTo(d)===1?'Domani · ':''}${fdLong(d)}</div>${es.map(e=>eventoRow(e)).join('')}`).join(''):empty('cal','Nessun appuntamento','')}</div>`;
}

/* ---------- Economia ---------- */
function vEconomia(){

  return`<div class="head"><div><div class="eyebrow">Incassi e fee</div><h1>Economia</h1><p>Rate dei piani di pagamento, fee varianti e strumenti di calcolo.</p></div></div>
  <div class="cards"><div class="card dark"><div class="card-label">Incassato</div><div class="metric amount">${eur(sum(r=>r.stato==='Incassata'))}</div><div class="card-foot">su tutte le commesse</div></div>
  <div class="card"><div class="card-label">Fatturato da incassare</div><div class="metric amount">${eur(sum(r=>r.stato==='Fatturata'))}</div><div class="card-foot">${rs.filter(r=>r.stato==='Fatturata').length} rate</div></div>
  <div class="card"><div class="card-label">Previsto</div><div class="metric amount">${eur(sum(r=>r.stato==='Prevista'))}</div><div class="card-foot">da fatturare al raggiungimento delle milestone</div></div>
  <div class="card"><div class="card-label">Scaduto</div><div class="metric amount" style="color:var(--red)">${eur(sum(filt.Scadute))}</div><div class="card-foot">oltre 60 gg: diffida ex art. 1454 c.c.</div></div></div>
  <div class="detail-grid">
    <div class="panel"><div class="panel-head"><h2>Calcolo fee varianti</h2><span class="subtle">AQ Varianti</span></div><div class="panel-body">
      <div class="calc-grid"><label>Prezzo di vendita unità (€)<input type="number" id="fv-prezzo" value="450000" min="0" step="1000"></label><label>Mesi di ritardo consegna<input type="number" id="fv-ritardo" value="0" min="0"></label></div>
      <div class="calculation" id="fv-out"></div>
      <div class="note">Fee varianti 0,50% + IVA a carico del cliente con varianti; consulenza base 0,20% + IVA a carico del committente per tutti i clienti. Ritardo: 0–3 mesi nessun costo, 3–6 mesi +0,20%, 6–9 mesi +0,15%, oltre 9 mesi da negoziare.</div>
    </div></div>
    <div class="panel"><div class="panel-head"><h2>Sconto cliente finale</h2><span class="subtle">margine obiettivo ~28%</span></div><div class="panel-body">
      <div class="calc-grid"><label>Importo a listino (€)<input type="number" id="sc-listino" value="18000" min="0" step="500"></label><label>Costo d'acquisto (€, facoltativo)<input type="number" id="sc-costo" placeholder="es. 9500" min="0"></label></div>
      <div class="calculation" id="sc-out"></div>
      <div class="note">Scontistica: 20% sotto 10.000 €, 25% tra 10.000 e 25.000 €, 30% oltre 25.000 €.</div>
    </div></div>
  </div>
  <div class="table-title"><h2>Rate</h2><div class="seg">${Object.keys(filt).map(k=>`<button class="${ui.rateFiltro===k?'active':''}" data-act="rateFiltro" data-v="${k}">${k}</button>`).join('')}</div></div>
  <div class="panel">${rateTable(rs.filter(filt[ui.rateFiltro]),true)}</div>`;
}
function wireEconomia(){
  const fv=()=>{const p=+$('#fv-prezzo').value||0,m=+$('#fv-ritardo').value||0,ind=indennizzo(m);$('#fv-out').innerHTML=`<div>Fee varianti 0,50%<strong>${eur2(p*FEE.varianti)}</strong></div><div>Consulenza 0,20%<strong>${eur2(p*FEE.consulenza)}</strong></div><div>Indennizzo ritardo<strong>${ind===null?'da negoziare':eur2(p*ind)}</strong></div><div>Totale BTWN<strong>${eur2(p*(FEE.varianti+FEE.consulenza+(ind||0)))}</strong></div>`};
  const sc=()=>{const l=+$('#sc-listino').value||0,c=+$('#sc-costo').value||0,s=sconto(l),net=l*(1-s);$('#sc-out').innerHTML=`<div>Sconto applicabile<strong>${Math.round(s*100)}%</strong></div><div>Prezzo al cliente<strong>${eur2(net)}</strong></div>${c?`<div>Margine<strong style="color:${(net-c)/net<.28?'var(--orange)':'inherit'}">${eur2(net-c)} · ${net?Math.round((net-c)/net*1000)/10:0}%</strong></div>`:''}`};
  if($('#fv-prezzo')){['#fv-prezzo','#fv-ritardo'].forEach(s=>$(s).oninput=fv);['#sc-listino','#sc-costo'].forEach(s=>$(s).oninput=sc);fv();sc()}
}

function fieldHtml(f,v){
  const val=v[f.k]??f.def??'';const cls=f.wide?'wide':'';const req=f.req?'required':'';
  if(f.type==='select')return`<label class="${cls}">${f.l}${selectHtml(f.opts,val,`name="${f.k}" ${req}`)}</label>`;
  if(f.type==='textarea')return`<label class="${cls}">${f.l}<textarea name="${f.k}">${esc(val)}</textarea></label>`;
  if(f.type==='checkbox')return`<label class="chk ${cls}"><input type="checkbox" name="${f.k}" ${val?'checked':''}>${f.l}</label>`;
  if(f.type==='multi')return`<div class="${cls}"><label>${f.l}</label><div class="multi" style="margin-top:6px">${f.opts.map(o=>`<label><input type="checkbox" name="${f.k}" value="${esc(o)}" ${(val||[]).includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div></div>`;
  return`<label class="${cls}">${f.l}<input name="${f.k}" type="${f.type||'text'}" value="${esc(val)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''} ${f.type==='number'?'step="any"':''} ${req}></label>`;
}
function openForm({title,fields,values={},onSave,calc,onDelete,intro}){
  const d=$('#modal');
  d.innerHTML=`<form id="mf" novalidate><div class="modal-head"><h2>${esc(title)}</h2><button type="button" class="ghost icon-btn" data-close aria-label="Chiudi">${ic('x')}</button></div><div class="modal-body">${intro?`<div class="note" style="margin-top:0">${intro}</div>`:''}<div class="form-grid">${fields.map(f=>fieldHtml(f,values)).join('')}</div>${calc?'<div class="calculation" id="calc"></div>':''}<div id="formErr"></div><div class="form-footer">${onDelete?`<button type="button" class="danger" id="mdel" style="margin-right:auto">${ic('trash')}Elimina</button>`:''}<button type="button" data-close>Annulla</button><button class="primary" type="submit">Salva</button></div></div></form>`;
  const form=$('#mf');
  const read=()=>{const o={};fields.forEach(f=>{if(f.type==='multi'){o[f.k]=[...form.querySelectorAll(`[name="${f.k}"]:checked`)].map(x=>x.value);return}const el=form.elements[f.k];if(!el)return;o[f.k]=f.type==='checkbox'?el.checked:f.type==='number'?(el.value===''?null:+el.value):el.value.trim()});return o};
  if(calc){const upd=()=>$('#calc').innerHTML=calc(read());form.addEventListener('input',upd);form.addEventListener('change',upd);upd()}
  d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.close());
  if(onDelete)$('#mdel').onclick=()=>{if(confirm('Eliminare definitivamente?')){onDelete();save();d.close();render();toast('Eliminato')}};
  form.onsubmit=e=>{e.preventDefault();const o=read();const miss=fields.filter(f=>f.req&&(o[f.k]===''||o[f.k]==null)).map(f=>f.l);if(miss.length){$('#formErr').innerHTML=`<div class="error">Compila: ${miss.join(', ')}</div>`;return}
    const res=onSave(o);if(res===false)return;save();d.close();render();toast('Salvato')};
  d.showModal();
  const first=form.querySelector('input:not([type=checkbox]),select,textarea');if(first)first.focus();
}

const prevDi=cid=>S.preventivi.filter(p=>p.commessaId===cid).sort((a,b)=>(a.titolo||'').localeCompare(b.titolo||'')||b.rev-a.rev);

const pct=v=>(v==null||v==='')?0:+v/100;
function rigaCalc(r,p){if(r.esclusa)return{L:0,costo:0,offerta:0,marg:0};const L=(r.qta===''||r.qta==null?1:+r.qta)*(+r.listino||0);const costo=L*(1-pct(r.scAcq));const offerta=L*(1-pct(r.scCli));let marg=offerta-costo;if(r.acquista==='Partner')marg=marg*(p.quotaPartner==null?50:+p.quotaPartner)/100;return{L,costo,offerta,marg}}

<style>:root{--bg:#f3f1ec;--paper:#fff;--paper-2:#eae7e0;--ink:#151412;--ink-2:#4a4743;--muted:#7a756e;--line:#d9d5cc;--accent:#e8451a;--ok:#2f6b3a;--warn:#a4661b;--f:"Archivo",system-ui,"Helvetica Neue",Arial,sans-serif;--shadow:0 18px 50px -24px rgba(20,18,14,.35)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f);-webkit-font-smoothing:antialiased}img{max-width:100%;display:block}a{color:inherit}h1,h2,h3{margin:0;line-height:1.05;text-wrap:balance}p{margin:0}button,input,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.top-in{max-width:1240px;margin:auto;padding:14px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.mark{font-weight:900;font-stretch:75%;font-size:22px;letter-spacing:-.5px;text-decoration:none}.mark b{color:var(--accent)}.proj{color:var(--muted);font-size:13px}.sec{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}.sec a{font-size:13px;text-decoration:none;padding:6px 10px;border-radius:99px;color:var(--ink-2)}.sec a:hover{background:var(--paper-2)}
.wrap{max-width:1240px;margin:auto;padding:0 24px 60px}.hero{display:grid;gap:40px;padding:64px 0 40px;align-items:center}@media(min-width:900px){.hero{grid-template-columns:1.1fr .9fr}}
.eyebrow{display:block;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:14px}h1{font-size:clamp(2.6rem,7vw,5.4rem);font-weight:900;font-stretch:80%;letter-spacing:-2px}.lede{font-size:1.15rem;color:var(--ink-2);margin-top:22px;max-width:40ch}
.meta{display:flex;flex-wrap:wrap;gap:28px;margin-top:30px;font-size:14px}.meta b{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.plan{margin:0;background:var(--paper);padding:14px;box-shadow:var(--shadow)}.plan figcaption{font-size:12px;color:var(--muted);margin-top:10px}
.chapters{display:grid;gap:2px;margin:20px 0 10px}@media(min-width:800px){.chapters{grid-template-columns:repeat(3,1fr)}}.chapters a{background:var(--paper);padding:22px;text-decoration:none;display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:1.05rem}.chapters a span{color:var(--muted);font-weight:500;font-size:13px}.chapters a:hover{background:var(--ink);color:var(--bg)}
section{padding:56px 0 10px;scroll-margin-top:70px}.sec-head{margin-bottom:26px;border-top:2px solid var(--ink);padding-top:22px}h2{font-size:clamp(2rem,4.5vw,3.4rem);font-weight:900;font-stretch:82%;letter-spacing:-1px}
.grid{display:grid;gap:22px;margin-bottom:22px}@media(min-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}.grid:has(> .prod:only-child){grid-template-columns:1fr}
.vs{background:var(--paper-2);padding:18px;margin-bottom:22px}.vs-h{font-weight:700;margin-bottom:14px}.vs .grid{margin:0}
.prod{background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column}.grid:has(> .prod:only-child) .prod{display:grid}@media(min-width:900px){.grid:has(> .prod:only-child) .prod{grid-template-columns:1.2fr 1fr}}
.media{background:var(--paper-2);overflow:hidden}.media img{width:100%;height:100%;max-height:520px;object-fit:cover;cursor:zoom-in}.body{padding:22px;display:flex;flex-direction:column;gap:12px}.k{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
h3{font-size:1.7rem;font-weight:850;font-stretch:85%}h3 small{display:block;font-size:.9rem;font-weight:500;color:var(--muted);margin-top:6px;font-stretch:100%}.d{color:var(--ink-2)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}.thumbs img{aspect-ratio:1;object-fit:cover;cursor:zoom-in}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:6px}.price{font-weight:800;font-size:1.25rem}.price small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.5px}.sheet{font-size:13px;color:var(--ink-2)}
.choose{display:flex;gap:10px;align-items:center;font-weight:700;padding:12px 14px;border:2px solid var(--line);cursor:pointer}.choose:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--paper))}.choose input{accent-color:var(--accent);width:18px;height:18px}
.react{display:flex;gap:6px;flex-wrap:wrap}.react button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer}.react button[aria-pressed=true][data-r=si]{background:var(--ok);border-color:var(--ok);color:#fff}.react button[aria-pressed=true][data-r=forse]{background:var(--warn);border-color:var(--warn);color:#fff}.react button[aria-pressed=true][data-r=no]{background:var(--ink);border-color:var(--ink);color:#fff}

.total{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;background:var(--ink);color:var(--bg);padding:26px;margin-top:40px;font-weight:800;font-size:1.3rem}.total small{display:block;font-size:12px;font-weight:500;opacity:.7}
.scelte{display:grid;gap:24px}@media(min-width:900px){.scelte{grid-template-columns:1fr 1fr}}.form{display:grid;gap:14px}.form label{font-size:13px;color:var(--muted);display:grid;gap:6px}.riep{background:var(--paper);padding:22px;box-shadow:var(--shadow)}pre{white-space:pre-wrap;font:13px/1.6 ui-monospace,Menlo,monospace;background:var(--bg);padding:14px;max-height:380px;overflow:auto}
.btn{display:inline-block;background:var(--ink);color:var(--bg);border:0;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none;margin:6px 6px 0 0}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.hint{font-size:13px;color:var(--muted)}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid var(--line);margin-top:60px;padding-top:20px;font-size:13px;color:var(--muted)}
.lb{position:fixed;inset:0;background:rgba(10,10,10,.92);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:3vw}.lb.on{display:flex}.lb img{max-height:94vh;object-fit:contain}

<div class="chapters">${amb.map((A,i)=>`<a href="#s${i+1}">${esc(A.n)}<span>${A.r.length} ${A.r.length===1?'elemento':'elementi'} →</span></a>`).join('')}<a href="#scelte">Le tue scelte<span>riepilogo →</span></a></div>
${sections}
${pg.mostraTotale?`<div class="total"><span>Totale offerta prodotto<small>Alternative escluse · trasporto e montaggio come da offerta</small></span><span>${eur2(t.netto)} IVA esclusa</span></div>`:''}

<footer><span class="mark"><b>[</b>BTWN<b>]</b></span><span>Between Contract &amp; Design · ${esc(a.sede||'Via Turati 8, Milano')} · btwn.it</span><span>${esc(pg.titolo||'')}${pg.data?' · '+esc(pg.data):''}</span></footer></main>
<div class="lb" id="lb"><img alt=""></div>
<script>(function(){var KEY=${JSON.stringify(KEY)},ITEMS=${JSON.stringify(items).replace(/</g,'\\u003c')},TITLE=${JSON.stringify(pg.titolo||'').replace(/</g,'\\u003c')},MAIL=${JSON.stringify(pg.email||'')};
var st={react:{},cmt:{},pick:{},nome:"",note:""};try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)st=Object.assign(st,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}sum()}
var R={si:"Mi piace",forse:"Da rivedere",no:"No"};
document.querySelectorAll(".prod").forEach(function(el){var id=el.getAttribute("data-item");el.querySelectorAll(".react button").forEach(function(b){b.setAttribute("aria-pressed",st.react[id]===b.dataset.r?"true":"false");b.onclick=function(){st.react[id]=st.react[id]===b.dataset.r?null:b.dataset.r;el.querySelectorAll(".react button").forEach(function(x){x.setAttribute("aria-pressed",st.react[id]===x.dataset.r?"true":"false")});save()}});var c=el.querySelector(".cmt");c.value=st.cmt[id]||"";c.oninput=function(){st.cmt[id]=c.value;save()};var r=el.querySelector(".choose input");if(r){if(st.pick[r.name]===id)r.checked=true;r.onchange=function(){st.pick[r.name]=id;save()}}});
var n=document.getElementById("fNome"),t=document.getElementById("fNote");n.value=st.nome;t.value=st.note;n.oninput=function(){st.nome=n.value;save()};t.oninput=function(){st.note=t.value;save()};
function text(){var L=[TITLE+" · le mie scelte",""];if(st.nome)L.push("Nome: "+st.nome,"");var picks=Object.keys(st.pick);if(picks.length){L.push("SCELTE");picks.forEach(function(g){var it=ITEMS[st.pick[g]];if(it)L.push("- "+it.a+": "+it.n)});L.push("")}var any=false;Object.keys(ITEMS).forEach(function(id){var r=st.react[id],c=st.cmt[id];if(r||c){if(!any){L.push("PREFERENZE");any=true}L.push("- "+ITEMS[id].a+" / "+ITEMS[id].n+(r?": "+R[r]:"")+(c?" — "+c:""))}});if(any)L.push("");if(st.note)L.push("NOTE",st.note);if(L.length<=2)L.push("Nessuna scelta ancora.");return L.join("\\n")}
function sum(){document.getElementById("sum").textContent=text();var m=document.getElementById("mail");if(m)m.href="mailto:"+MAIL+"?subject="+encodeURIComponent(TITLE+" · le mie scelte")+"&body="+encodeURIComponent(text())}
document.getElementById("copy").onclick=function(){var msg=document.getElementById("msg");(navigator.clipboard?navigator.clipboard.writeText(text()):Promise.reject()).then(function(){msg.textContent="Copiato"},function(){msg.textContent="Seleziona il testo e copialo"})};
document.getElementById("reset").onclick=function(){if(confirm("Azzerare tutte le scelte?")){st={react:{},cmt:{},pick:{},nome:"",note:""};save();location.reload()}};
var lb=document.getElementById("lb");document.addEventListener("click",function(e){var i=e.target.closest("[data-zoom]");if(i){lb.querySelector("img").src=i.src;lb.querySelector("img").alt=i.alt;lb.classList.add("on")}else if(e.target.closest("#lb"))lb.classList.remove("on")});document.addEventListener("keydown",function(e){if(e.key==="Escape")lb.classList.remove("on")});
sum()})();<\/script></body></html>`;
}
function apriPagina(p){const w=window.open('','_blank');if(!w){toast('Consenti i pop-up per vedere l\'anteprima');return}w.document.write(paginaHTML(p,true));w.document.close()}
function scaricaPagina(p){const slug=((p.pagina&&p.pagina.titolo)||'pagina-cliente').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');download(slug+'.html',paginaHTML(p,false),'text/html');toast('Pagina scaricata: '+slug+'.html')}


/* ---------- Workflow cliente privato ---------- */
function workflowView(c){
  c.steps=c.steps||{};
  const est=c.esterni||[], rip=c.ripristini||[];
  const lnk={progettazione:`<button class="small" data-act="newEsterno" data-id="${c.id}">${ic('plus')}Fattura agenzia</button>`,economica:`<button class="small" data-act="nav" data-h="#/commessa/${c.id}/preventivi">${ic('calc')}Preventivi</button>`,appuntamento:`<button class="small" data-act="newEvento" data-c="${c.id}">${ic('cal')}Fissa</button>`,firma:`<button class="small" data-act="nav" data-h="#/commessa/${c.id}/pagamenti">${ic('euro')}Rate</button>`,ordine:`<button class="small" data-act="nav" data-h="#/commessa/${c.id}/ordini">${ic('box')}Ordini</button>`,verbale:`<button class="small" data-act="newRipristino" data-id="${c.id}">${ic('plus')}Da riordinare / sistemare</button>`,ripristino:`<button class="small" data-act="newRipristino" data-id="${c.id}">${ic('plus')}Da riordinare / sistemare</button>`};
  const extra=id=>{
    if(id==='progettazione')return est.length?`<div class="table-wrap" style="margin-top:6px"><table><thead><tr><th>Agenzia</th><th>Brand</th><th>Fattura</th><th class="right-txt">Importo</th><th></th></tr></thead><tbody>${est.map((x,i)=>`<tr><td>${esc(x.agenzia)}</td><td>${esc(x.brand||'—')}</td><td>${esc(x.fattura||'—')}<small>${fd(x.data)}</small></td><td class="amount right-txt">${eur2(x.importo)}</td><td><button class="icon-btn" data-act="editEsterno" data-id="${c.id}" data-i="${i}">${ic('edit')}</button></td></tr>`).join('')}</tbody></table></div>`:'';
    if(id==='rilievo')return`<div class="toolbar" style="margin:4px 0 8px"><div class="seg"><button class="${c.rilievo!=='speciale'?'active':''}" data-act="rilievoMode" data-id="${c.id}" data-v="rilevabile">Casa rilevabile</button><button class="${c.rilievo==='speciale'?'active':''}" data-act="rilievoMode" data-id="${c.id}" data-v="speciale">Non rilevabile: procedura speciale</button></div></div>${c.rilievo==='speciale'?'<div class="note" style="background:#fff7ea;color:#9b784c">Eccezione: ordiniamo sui disegni tecnici. Il cliente si obbliga in solido a farli rispettare; se la merce non ci sta, tutte le spese sono sue.</div>':''}`;
    if(id==='op_capitolato')return`<label style="margin-bottom:8px">Come entra l'arredo${selectHtml(['','Nel prezzo di vendita dell\'appartamento','On top al prezzo di vendita','Metà sviluppatore, metà cliente'],c.capFormula||'',`data-change="capFormula" data-id="${c.id}"`)}</label>`;
    if(id==='op_retro'){const gg=+c.retroGiorni||120;const lim=c.dataFiniti?addDays(c.dataFiniti,-gg):'';return`<div class="calc-grid" style="margin-bottom:8px"><label>Appartamenti finiti per il<input type="date" data-change="retro" data-id="${c.id}" data-k="dataFiniti" value="${esc(c.dataFiniti||'')}"></label><label>Giorni tra rilievo e montaggio finito<input type="number" data-change="retro" data-id="${c.id}" data-k="retroGiorni" value="${gg}"></label></div>${lim?`<div class="note">Gli appartamenti devono essere finiti e rilevabili entro il <b>${fd(lim)}</b>${daysTo(lim)<0?' <span class="tag red">data superata</span>':' · tra '+daysTo(lim)+' giorni'}.</div>`:''}`}
    if(id==='op_montaggio'){const l=c.logistica||{};return`<div class="kv"><span>Società di logistica</span><b>${esc(l.societa||'—')}${l.importo?' · '+eur(l.importo):''}</b></div>${l.note?`<p class="subtle">${esc(l.note)}</p>`:''}<div style="margin:8px 0"><button class="small" data-act="logistica" data-id="${c.id}">${ic('edit')}Contratto logistica</button></div>`}
    if(id==='verbale'||id==='ripristino')return rip.length?`<div class="table-wrap" style="margin-top:6px"><table><thead><tr><th>Da riordinare / sistemare</th><th>Azienda</th><th>Stato</th><th>Intervento</th><th></th></tr></thead><tbody>${rip.map((x,i)=>`<tr><td>${esc(x.descrizione)}</td><td>${esc(x.azienda||'—')}</td><td>${selectHtml(STATI_RIPRISTINO,x.stato,`class="inline-select" data-change="ripStato" data-id="${c.id}" data-i="${i}"`)}</td><td>${fd(x.data)}</td><td><button class="icon-btn" data-act="editRipristino" data-id="${c.id}" data-i="${i}">${ic('edit')}</button></td></tr>`).join('')}</tbody></table></div>`:'';
    return'';
  };
  const WF=wfFor(c);
  return WF.map((ph,fi)=>{
    const st=wfSteps(c,ph), done=st.filter(([k])=>c.steps[k]).length, req=st.filter(x=>!x[2]), reqDone=req.every(([k])=>c.steps[k]), cur=fi+1===c.fase, past=fi+1<c.fase;
    if(ph.id==='ripristino'&&!rip.length&&!cur&&done===0)return`<div class="panel" style="opacity:.6"><div class="panel-head"><h2><span class="number-circle">${fi+1}</span>${esc(ph.f)}</h2><span class="subtle">solo se nel verbale ci sono cose da riordinare o sistemare</span></div></div>`;
    return`<div class="panel" style="${cur?'border-color:#305e47;box-shadow:0 0 0 2px #dce9d6':''}"><div class="panel-head"><h2><span class="number-circle" style="${past||reqDone?'background:#a8c98b;border-color:#a8c98b;color:#173d39':''}">${fi+1}</span>${esc(ph.f)} ${cur?'<span class="tag">fase attuale</span>':''}</h2><div class="actions">${lnk[ph.id]||''}<span class="tag ${reqDone?'':'gray'}">${done}/${st.length}</span></div></div><div class="panel-body">${extra(ph.id)}${st.map(([k,t,opt])=>{const v=c.steps[k];return`<label class="check-row ${v?'done':''}"><input type="checkbox" data-change="step" data-id="${c.id}" data-k="${k}" data-f="${fi+1}" ${v?'checked':''}><span style="flex:1">${esc(t)}${opt?' <span class="tag gray">se serve</span>':''}</span>${v?`<span class="subtle">${fd(v)}</span>`:''}</label>`}).join('')}${cur&&reqDone&&fi+1<WF.length?`<div style="margin-top:14px"><button class="lime" data-act="avanza" data-id="${c.id}">Fatto: passa a ${esc(WF[fi+1].f)} ${ic('arrow')}</button></div>`:''}</div></div>`}).join('');
}
function formEsterno(c,i){
  const isNew=i==null;const x=isNew?{data:today()}:c.esterni[i];
  openForm({title:isNew?'Progettazione esterna':'Progettazione · '+x.agenzia,values:x,intro:'Agenzia che tratta il brand e sviluppa una parte degli arredi: emette a BTWN fattura di servizio (costo della commessa).',fields:[{k:'agenzia',l:'Agenzia',req:true},{k:'brand',l:'Brand trattato'},{k:'oggetto',l:'Cosa ha progettato',wide:true},{k:'importo',l:'Importo fattura di servizio (€, IVA esclusa)',type:'number'},{k:'fattura',l:'N. fattura'},{k:'data',l:'Data',type:'date'}],
    onSave:o=>{c.esterni=c.esterni||[];if(isNew)c.esterni.push(o);else Object.assign(x,o)},onDelete:isNew?null:()=>{c.esterni.splice(i,1)}});
}
function formRipristino(c,i){
  const isNew=i==null;const x=isNew?{stato:'Da richiedere'}:c.ripristini[i];
  openForm({title:isNew?'Voce di ripristino':'Ripristino',values:x,intro:'Cosa riordinare o sistemare, annotato nel verbale di fine lavori.',fields:[{k:'descrizione',l:'Da riordinare / sistemare',req:true,wide:true},{k:'azienda',l:'Azienda'},{k:'stato',l:'Stato',type:'select',opts:STATI_RIPRISTINO},{k:'data',l:'Data intervento dal cliente',type:'date'},{k:'note',l:'Note',type:'textarea',wide:true}],
    onSave:o=>{c.ripristini=c.ripristini||[];if(isNew)c.ripristini.push(o);else Object.assign(x,o)},onDelete:isNew?null:()=>{c.ripristini.splice(i,1)}});
}


/* ---------- Servizi B2B (operazioni immobiliari) ---------- */
function editTable(c,list,cols,calc,emptyTxt){
  const rows=c[list]||[];
  const cell=(r,col)=>{const v=r[col.f]??'';const base=`data-cl="${c.id}" data-ls="${list}" data-r="${r.id}" data-f="${col.f}"`;
    if(col.type==='select')return selectHtml(typeof col.opts==='function'?col.opts():col.opts,v,`class="inline-select" ${base}`);

function vVendite(){

  editAzienda:()=>openForm({title:'Dati aziendali',values:S.azienda||{},fields:[{k:'ragione',l:'Ragione sociale',wide:true},{k:'piva',l:'P.IVA'},{k:'pec',l:'PEC'},{k:'sede',l:'Sede legale',wide:true}],onSave:o=>{S.azienda=o}}),
  newFile:d=>{const c=commessa(d.id);openForm({title:'Collega documento',values:{data:today()},fields:[{k:'nome',l:'Nome documento',req:true,wide:true},{k:'url',l:'Link (Drive, Dropbox, …)',type:'url',wide:true},{k:'tipo',l:'Tipo',ph:'es. Contratto, DWG, Verbale'},{k:'data',l:'Data',type:'date'}],onSave:o=>{(c.files=c.files||[]).push(o)}})},
  delFile:d=>{const c=commessa(d.id);if(confirm('Rimuovere il documento?')){c.files.splice(+d.i,1);save();render()}},
  clearDemo:()=>{if(!confirm('Rimuovere unità, rate e appuntamenti di esempio? Commesse, clienti e brand restano.'))return;S.unita=[];S.rate=[];S.eventi=[];S.demo=false;save();render();toast('Esempi rimossi')},
  keepDemo:()=>{S.demo=false;save();render()},
  export:()=>download(`btwn-bussola-backup-${today()}.json`,JSON.stringify(S,null,2),'application/json'),
  exportCsv:()=>{const rows=[['Commessa','Unità','Rata','Condizione','%','Importo','Scadenza','Stato']];S.rate.forEach(r=>{const c=commessa(r.commessaId),u=r.unitaId&&byId('unita',r.unitaId);rows.push([c?c.nome:'',u?u.codice:'',r.descrizione,r.quando||'',r.perc??'',String(r.importo).replace('.',','),r.scadenza||'',r.stato])});download(`btwn-rate-${today()}.csv`,'﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv')},
  import:()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!d.commesse||!d.users)throw new Error();if(!confirm('Sostituire tutti i dati attuali con il backup?'))return;S=d;save();if(!me())localStorage.setItem(SESSION,S.users[0].id);render();toast('Backup importato')}).catch(()=>toast('File di backup non valido'))};i.click()},
  resetDemo:()=>{if(confirm('Sostituire tutti i dati con quelli dimostrativi?')){const name=me().nome;S=seed();const u=S.users.find(x=>x.nome===name)||S.users[0];localStorage.setItem(SESSION,u.id);save();go('#/dashboard');toast('Dati dimostrativi ripristinati')}},
  wipe:()=>{if(confirm('Cancellare TUTTI i dati? Esporta prima un backup.')&&confirm('Confermi la cancellazione?')){const u=me();S={version:1,demo:false,azienda:S.azienda,users:[u],clienti:[],commesse:[],unita:[],rate:[],eventi:[],fornitori:[]};save();go('#/dashboard');toast('Dati cancellati')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.closest('dialog')&&!t.closest('#app'))return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t.dataset,t)}});
document.addEventListener('change',e=>{
  const gt=e.target.closest('[data-cl][data-ls][data-f]');
  if(gt){const c=commessa(gt.dataset.cl),r=(c[gt.dataset.ls]||[]).find(x=>x.id===gt.dataset.r);if(!r)return;const v=gt.value;r[gt.dataset.f]=gt.type==='number'?(v===''?null:+String(v).replace(',','.')):v;save();setTimeout(()=>{render.keepScroll=true;render()},0);return}
  const g=e.target.closest('[data-pr][data-f]');
  if(g){const p=byId('preventivi',g.dataset.pr),r=p&&p.righe.find(x=>x.id===g.dataset.r);if(!r)return;const f=g.dataset.f;
    let v=g.value;if(['qta','listino','scAcq','scCli'].includes(f))v=v===''?null:+String(v).replace(',','.');r[f]=v;
    if(f==='brand'){const fo=S.fornitori.find(x=>x.nome.toLowerCase()===String(v).toLowerCase());if(fo){if(r.scAcq==null&&fo.scontoAcq!=null)r.scAcq=+fo.scontoAcq;if(r.scCli==null&&fo.scontoCli!=null)r.scCli=+fo.scontoCli}if(String(v).toUpperCase()==='BTWN'&&r.scAcq==null)r.scAcq=0}
    save();setTimeout(()=>{render.keepScroll=true;render()},0);return}
  const t=e.target.closest('[data-change]');if(!t)return;const d=t.dataset;
  if(d.change==='filtroStato'){ui.filtroStato=t.value;render()}
  if(d.change==='statoUnita'){const u=byId('unita',d.id);u.stato=t.value;save();render();toast(u.codice+' → '+t.value)}
  if(d.change==='statoRata'){const r=byId('rate',d.id);r.stato=t.value;save();render();toast('Rata: '+t.value)}
  if(d.change==='prevStato'){const p=byId('preventivi',d.id);if(t.value==='Accettato'){t.value=p.stato;A.accettaPrev({id:p.id});return}p.stato=t.value;save();render();toast('Preventivo: '+t.value)}
  if(d.change==='ordineStato'){const o=byId('ordini',d.id);o.stato=t.value;save();render.keepScroll=true;render();toast(o.fornitore+' → '+t.value)}
  if(d.change==='arrPrezzo'){const c=commessa(d.id);c.arrPrezzi=Object.assign({},c.arrPrezzi,{[d.k]:t.value===''?null:+t.value});save();render.keepScroll=true;render()}
  if(d.change==='capFormula'){const c=commessa(d.id);c.capFormula=t.value;save();render.keepScroll=true;render()}
  if(d.change==='retro'){const c=commessa(d.id);c[d.k]=t.type==='number'?+t.value:t.value;save();render.keepScroll=true;render()}
  if(d.change==='diffCfg'){const c=commessa(d.id);c.diffCfg=Object.assign(diffCfg(c),{[d.k]:t.type==='number'?+t.value:t.value});save();render.keepScroll=true;render()}
  if(d.change==='formula'){const c=commessa(d.id);c.formula=t.value;save();render.keepScroll=true;render()}
  if(d.change==='cfgTipo'){const c=commessa(d.id);c.cfgTipo=t.value;save();render.keepScroll=true;render()}
  if(d.change==='statoVar'){const u=byId('unita',d.id);u.statoVar=t.value;u.varianti=t.value!=='Nessuna variante';save();render.keepScroll=true;render();toast(u.codice+' · '+t.value)}
  if(d.change==='step'){const c=commessa(d.id);c.steps=c.steps||{};if(t.checked){c.steps[d.k]=today();if(+d.f>c.fase)c.fase=+d.f}else delete c.steps[d.k];save();render.keepScroll=true;render()}
  if(d.change==='ripStato'){const c=commessa(d.id);c.ripristini[+d.i].stato=t.value;save();render.keepScroll=true;render();toast('Ripristino: '+t.value)}
  if(d.change==='doc'){const c=commessa(d.id);c.docs=c.docs||{};c.docs[d.i]=t.checked?1:0;save();render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}});

load();render();
</script></body></html>
